rectory itself.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "mdfind"}, {"id": "macos-specifics-inspect-mounted-disks", "category": "macOS specifics", "title": "Inspect mounted disks", "command": "diskutil list", "explanation": "Lists disks and partitions without modifying them. Disk erase and repair subcommands are separate operations.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "diskutil"}, {"id": "macos-specifics-inspect-network-interfaces", "category": "macOS specifics", "title": "Inspect network interfaces", "command": "networksetup -listallhardwareports", "explanation": "Maps hardware ports to device names such as en0. Does not change network configuration.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "networksetup"}, {"id": "macos-specifics-inspect-macos-dns-configuration", "category": "macOS specifics", "title": "Inspect macOS DNS configuration", "command": "scutil --dns", "explanation": "Useful when VPN or split DNS behaves differently from a direct dig query. Output can reveal internal network names.", "level": "Advanced", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "scutil"}, {"id": "macos-specifics-inspect-proxy-configuration", "category": "macOS specifics", "title": "Inspect proxy configuration", "command": "scutil --proxy", "explanation": "Read-only check for system HTTP/SOCKS proxy settings. Individual CLI tools may also use environment variables.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "scutil"}, {"id": "macos-specifics-check-one-preference-domain", "category": "macOS specifics", "title": "Check one preference domain", "command": "defaults read com.apple.finder AppleShowAllFiles", "explanation": "Reads a single Finder preference. A missing key means there is no explicit user override.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "defaults"}, {"id": "macos-specifics-validate-a-property-list", "category": "macOS specifics", "title": "Validate a property list", "command": "plutil -lint ~/Library/LaunchAgents/com.example.agent.plist", "explanation": "Checks plist syntax only. Valid XML does not mean the program it points at will start.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "plutil"}, {"id": "macos-specifics-inspect-a-launch-agent", "category": "macOS specifics", "title": "Inspect a launch agent", "command": "launchctl print gui/$(id -u)/com.example.agent", "explanation": "Reports registration and last-exit status for a per-user agent. The Linux equivalent is systemctl --user status.", "level": "Advanced", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "launchctl"}, {"id": "macos-specifics-check-update-availability", "category": "macOS specifics", "title": "Check update availability", "command": "softwareupdate --list", "explanation": "Contacts Apple's update service and lists available updates without installing them. May take a while.", "level": "Intermediate", "effect": "Network", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "softwareupdate"}, {"id": "macos-specifics-create-a-screenshot-file", "category": "macOS specifics", "title": "Create a screenshot file", "command": "screencapture -i ~/Desktop/terminal-example.png", "explanation": "Opens macOS interactive capture and writes your selection. Review the visible content before sharing the image.", "level": "Start", "effect": "Write", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "screencapture"}, {"id": "macos-specifics-show-recent-app-log-events", "category": "macOS specifics", "title": "Show recent app log events", "command": "log show --last 5m --style compact --predicate 'process == \"Ghostty\"'", "explanation": "Narrows the macOS unified log to one process and a short window. Logs can contain private content. journalctl is the Linux counterpart.", "level": "Advanced", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "log"}, {"id": "macos-specifics-check-backup-status", "category": "macOS specifics", "title": "Check backup status", "command": "tmutil status", "explanation": "Reports Time Machine's current operation. An idle result does not prove a recent backup exists.", "level": "Intermediate", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "tmutil"}, {"id": "macos-specifics-read-archive-contents", "category": "macOS specifics", "title": "Read archive contents", "command": "tar -tf archive.tar.gz", "explanation": "Lists what an archive holds without extracting it. Always look before extracting an archive you did not create.", "level": "Start", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "tar"}, {"id": "macos-specifics-create-a-project-note-archive", "category": "macOS specifics", "title": "Create a project-note archive", "command": "tar -czf notes-backup.tar.gz README.md docs", "explanation": "Writes an archive from explicit files and folders. Choose a new output path and exclude secrets.", "level": "Intermediate", "effect": "Write", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "tar"}, {"id": "macos-specifics-connect-using-ssh", "category": "macOS specifics", "title": "Connect using SSH", "command": "ssh user@example-host", "explanation": "Replace with your account and host. Verify a new host's fingerprint through a trusted channel before accepting it.", "level": "Intermediate", "effect": "Network", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "ssh"}, {"id": "macos-specifics-copy-one-file-over-ssh", "category": "macOS specifics", "title": "Copy one file over SSH", "command": "scp ./report.txt user@example-host:/path/to/destination/", "explanation": "Replace the example user, host and directory. Uploads the file to that host and may overwrite an existing destination file.", "level": "Intermediate", "effect": "Remote write", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "scp"}, {"id": "macos-specifics-check-the-selected-editor", "category": "macOS specifics", "title": "Check the selected editor", "command": "print -r -- \"$EDITOR\"", "explanation": "Git and other tools open this. A value such as code --wait makes them wait for the window to close.", "level": "Start", "effect": "Inspect", "source": "https://support.apple.com/guide/terminal/welcome/mac", "tool": "print"}, {"id": "linux-specifics-identify-the-distribution", "category": "Linux specifics", "title": "Identify the distribution", "command": "cat /etc/os-release", "explanation": "Tells you which package manager and package names apply. Scripts should read ID and VERSION_ID rather than guessing.", "level": "Start", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "cat"}, {"id": "linux-specifics-see-listening-ports", "category": "Linux specifics", "title": "See listening ports", "command": "ss -tlnp", "explanation": "The Linux answer to lsof for ports. Process names for other users' processes need sudo.", "level": "Start", "effect": "Inspect", "source": "https://man7.org/linux/man-pages/man8/ss.8.html", "tool": "ss"}, {"id": "linux-specifics-check-a-service", "category": "Linux specifics", "title": "Check a service", "command": "systemctl status docker", "explanation": "Shows whether a service is enabled, running and what it last logged. Replace docker with any unit name.", "level": "Start", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/systemctl.html", "tool": "systemctl"}, {"id": "linux-specifics-start-a-service-now-and-at-boot", "category": "Linux specifics", "title": "Start a service now and at boot", "command": "sudo systemctl enable --now docker", "explanation": "Two things at once: start it, and start it on every boot. Use disable --now to undo both.", "level": "Intermediate", "effect": "Disruptive", "source": "https://www.freedesktop.org/software/systemd/man/systemctl.html", "tool": "systemctl"}, {"id": "linux-specifics-read-a-service-s-logs", "category": "Linux specifics", "title": "Read a service's logs", "command": "journalctl -u docker -n 100 --no-pager", "explanation": "The last 100 lines for one unit. Add -f to follow. Add --since '10 min ago' to bound it by time.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/journalctl.html", "tool": "journalctl"}, {"id": "linux-specifics-read-your-own-user-services", "category": "Linux specifics", "title": "Read your own user services", "command": "systemctl --user list-units --type=service", "explanation": "Per-user services, the counterpart to macOS launch agents.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/systemctl.html", "tool": "systemctl"}, {"id": "linux-specifics-check-memory-and-swap", "category": "Linux specifics", "title": "Check memory and swap", "command": "free -h", "explanation": "Human-readable totals. The available column matters more than free: Linux deliberately uses spare memory for cache.", "level": "Start", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "free"}, {"id": "linux-specifics-check-memory-pressure", "category": "Linux specifics", "title": "Check memory pressure", "command": "cat /proc/pressure/memory", "explanation": "Pressure stall information: how much time tasks spent waiting on memory. Better evidence than a single free number.", "level": "Advanced", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "cat"}, {"id": "linux-specifics-describe-the-cpu", "category": "Linux specifics", "title": "Describe the CPU", "command": "lscpu | Cores, threads, architecture and flags. lscpu", "explanation": "rg 'Model name' narrows it to one line.", "level": "Start", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "lscpu"}, {"id": "linux-specifics-check-disk-space", "category": "Linux specifics", "title": "Check disk space", "command": "df -h", "explanation": "Built-in and always present. duf prints the same data in a friendlier table.", "level": "Start", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "df"}, {"id": "linux-specifics-search-installed-packages", "category": "Linux specifics", "title": "Search installed packages", "command": "apt list --installed", "explanation": "Debian and Ubuntu. Fedora uses dnf list installed; Arch uses pacman -Q.", "level": "Start", "effect": "Inspect", "source": "https://manpages.debian.org/stable/apt/apt.8.en.html", "tool": "apt"}, {"id": "linux-specifics-find-which-package-owns-a-file", "category": "Linux specifics", "title": "Find which package owns a file", "command": "dpkg -S \"$(command -v git)\"", "explanation": "Debian and Ubuntu. Fedora uses dnf provides; Arch uses pacman -Qo.", "level": "Intermediate", "effect": "Inspect", "source": "https://manpages.debian.org/stable/dpkg/dpkg.1.en.html", "tool": "dpkg"}, {"id": "linux-specifics-read-a-package-s-description", "category": "Linux specifics", "title": "Read a package's description", "command": "apt show ripgrep", "explanation": "Version, size, dependencies and homepage, before installing anything.", "level": "Start", "effect": "Inspect", "source": "https://manpages.debian.org/stable/apt/apt.8.en.html", "tool": "apt"}, {"id": "linux-specifics-refresh-and-inspect-updates", "category": "Linux specifics", "title": "Refresh and inspect updates", "command": "sudo apt update\napt list --upgradable", "explanation": "update refreshes metadata only. Nothing is upgraded until you run apt upgrade.", "level": "Intermediate", "effect": "Network", "source": "https://manpages.debian.org/stable/apt/apt.8.en.html", "tool": "apt"}, {"id": "linux-specifics-make-zsh-your-login-shell", "category": "Linux specifics", "title": "Make zsh your login shell", "command": "chsh -s \"$(command -v zsh)\"", "explanation": "Takes effect at your next login, not in this terminal. Install zsh first or you will be locked out of a working shell.", "level": "Intermediate", "effect": "Write", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "chsh"}, {"id": "linux-specifics-copy-to-the-clipboard", "category": "Linux specifics", "title": "Copy to the clipboard", "command": "printf '%s\\n' hello | xclip -selection clipboard", "explanation": "X11. On Wayland use wl-copy. macOS uses pbcopy.", "level": "Intermediate", "effect": "Write", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "printf"}, {"id": "linux-specifics-open-a-file-with-the-desktop-default", "category": "Linux specifics", "title": "Open a file with the desktop default", "command": "xdg-open README.md", "explanation": "The Linux counterpart to macOS open. Needs a desktop session.", "level": "Start", "effect": "Run", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "xdg-open"}, {"id": "linux-specifics-check-your-kernel", "category": "Linux specifics", "title": "Check your kernel", "command": "uname -srm", "explanation": "Kernel name, release and machine architecture. Some tools ship separate arm64 and x86_64 builds.", "level": "Start", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "uname"}, {"id": "linux-specifics-inspect-a-user-s-groups", "category": "Linux specifics", "title": "Inspect a user's groups", "command": "id -nG", "explanation": "Shows your groups. Running Docker without sudo requires membership in the docker group, which is equivalent to root access.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.freedesktop.org/software/systemd/man/", "tool": "id"}], "shortcuts": [["zsh", "Ctrl+A / Ctrl+E", "Move to start / end of command"], ["zsh", "Ctrl+U / Ctrl+K", "Cut text before / after cursor"], ["zsh", "Ctrl+W / Ctrl+Y", "Cut previous word / paste cut text"], ["zsh", "Ctrl+R", "Fuzzy-search command history"], ["zsh", "Ctrl+T", "Find and insert a file path (fzf)"], ["zsh", "Alt+C", "Pick a directory with fzf"], ["zsh", "↑ / ↓", "Search history using your current input"], ["zsh", "→", "Accept autosuggestion when at the end of input"], ["zsh", "Tab / Shift+Tab", "Complete a command or navigate completion choices"], ["zsh", "Ctrl+C", "Interrupt the foreground command"], ["zsh", "Ctrl+Z → fg", "Suspend, then resume a job"], ["zsh", "Ctrl+L", "Redraw the terminal screen"], ["Ghostty", "Cmd+D / Cmd+Shift+D", "Split right / split down"], ["Ghostty", "Cmd+[ / Cmd+]", "Previous / next split"], ["Ghostty", "Cmd+Shift+Enter", "Zoom the active split"], ["Ghostty", "Cmd+T", "Open a tab"], ["Ghostty", "Cmd+Shift+[ / ]", "Previous / next tab"], ["Ghostty", "Cmd+Shift+R", "Reload the Ghostty configuration"], ["Ghostty", "Cmd+plus / minus / zero", "Increase / decrease / reset font size"], ["Ghostty", "Cmd+K", "Clear scrollback"], ["tmux", "Ctrl+B, D", "Detach; the session keeps running"], ["tmux", "Ctrl+B, C", "New tmux window"], ["tmux", "Ctrl+B, % / \"", "Split side by side / stacked"], ["Neovim", "Esc → :w / :q / :wq", "Normal mode → save / quit / save and quit"], ["Neovim", "/text → n / N", "Search → next / previous match"], ["Neovim", "Space", "Open LazyVim leader-key hints"]], "workflows": [{"title": "A deliberate start to a coding session", "tag": "Daily", "intro": "Establish context before changing anything. Tools become far more predictable once the directory, branch and runtime are explicit rather than assumed.", "steps": [["Go to the project", "cd ~/projects/your-app"], ["Check your branch and edits", "git status --short --branch"], ["Check runtime and available scripts", "node --version\npnpm --version\npnpm run"], ["Start development", "pnpm dev"]], "finish": "Open a second split or tab for Git and tests. Keep the dev server visible so you notice failures when they happen, not ten minutes later."}, {"title": "Diagnose “port 3000 is already in use”", "tag": "Debugging", "intro": "Find the owner before killing anything. A port conflict is often an old dev server, but it can just as easily be a different project you still need. On Linux, ss -tlnp replaces lsof.", "steps": [["Identify the listener", "lsof -nP -iTCP:3000 -sTCP:LISTEN"], ["Inspect the owner", "ps -p PID -o pid,ppid,etime,command"], ["Stop it intentionally", "kill $(lsof -nP -iTCP:3000 -sTCP:LISTEN -t)"], ["Restart your intended server", "pnpm dev"]], "finish": "Replace PID with the real number. Prefer Ctrl+C in the terminal that owns the server. kill sends SIGTERM, which asks a process to stop and discards its unsaved work."}, {"title": "Bring up and inspect a WordPress site", "tag": "WordPress", "intro": "Run WordPress through the project’s containers so PHP, WordPress and the database versions stay aligned. This assumes the stack defines a wpcli service.", "steps": [["Enter the site directory", "cd ~/projects/your-wordpress-site"], ["Validate before starting", "docker compose config --quiet"], ["Start and check services", "docker compose up -d\ndocker compose ps"], ["Inspect WordPress", "docker compose exec wpcli wp core version\ndocker compose exec wpcli wp plugin list"], ["Follow application logs", "docker compose logs --tail=100 -f wordpress"]], "finish": "Ctrl+C exits logs. docker compose stop preserves the containers and volumes. Database export files are sensitive and should stay out of Git."}, {"title": "Review a change like a senior engineer", "tag": "Git", "intro": "Review behavior, boundaries and failure modes. Commit only changes you can explain.", "steps": [["Understand scope", "git status --short\ngit diff --stat\ngit diff"], ["Run the project checks", "pnpm lint \u0026\u0026 pnpm typecheck"], ["Choose hunks", "git add -p"], ["Review staged content", "git diff --staged\ngit diff --staged --check"], ["Commit the intent", "git commit -m \"Describe the behavior changed\""]], "finish": "Run the relevant test script where it exists. A formatter or passing test suite alone does not prove the change solves the right problem."}, {"title": "Switch from web development to local AI", "tag": "Memory", "intro": "A language model, a container VM and a browser all want the same RAM. On a 16–24 GB machine you have to choose between them rather than run everything.", "steps": [["Inspect current workloads", "docker ps\nollama ps"], ["Stop the container VM if you no longer need it", "colima stop"], ["Start an inference session", "ollama run llama3.1:8b"], ["Unload after use", "ollama stop llama3.1:8b"], ["Restore the VM when you need it again", "colima start"]], "finish": "Stopping the VM interrupts every container, so finish their work first. If memory is tight, choose a smaller model or a shorter context. A model’s file size is a floor for its memory use, not a measurement of it. On Linux, replace the colima steps with systemctl start/stop docker."}, {"title": "Maintain packages without surprise upgrades", "tag": "Weekly", "intro": "Refresh metadata, read the proposed changes, then upgrade deliberately. Dependency libraries are part of the toolchain, not clutter to be pruned. Homebrew here; apt, dnf and pacman have the same three phases.", "steps": [["Check package health", "brew missing\nbrew doctor"], ["Refresh and inspect updates", "brew update\nbrew outdated"], ["Inspect one candidate", "brew info ripgrep"], ["Upgrade that tool", "brew upgrade ripgrep"], ["Preview cleanup", "brew cleanup --dry-run\nbrew autoremove --dry-run"]], "finish": "Never answer a permissions warning with a recursive sudo chown on a package directory. Upgrade one tool at a time when a project depends on its behaviour, and read release notes for anything that crosses a major version."}, {"title": "Turn a one-off command into reliable automation", "tag": "Advanced", "intro": "Start with a read-only preview, understand filenames and exit codes, then write the smallest script that does the job. ShellCheck targets sh and bash; zsh -n is the syntax check for zsh scripts.", "steps": [["Create a practice directory", "mkdir -p ~/terminal-practice\ncd ~/terminal-practice"], ["List targets first", "fd -e txt --type f"], ["Handle spaces and empty matches", "for file in *.txt(N); do print -r -- \"$file\"; done"], ["Check a zsh script before running it", "zsh -n script.zsh"]], "finish": "Quote variable expansions, use -- before user-provided paths, check failures, and never parse ls output. For filename pipelines use null separators, such as fd -0 with xargs -0, and preview the action first."}], "lessons": [["1", "Move confidently", "Use pwd, cd, z, ll, fd and Ctrl+R without guessing where you are.", "Find a source file in one project, preview it with bat, then return with cd -.", ["pwd", "fd", "zoxide"]], ["2", "Read command structure", "Understand command, subcommand, flags, arguments, quotes and exit status.", "Explain every token in: rg -n -F \"process.env.\" -g \"*.ts\" .", ["rg", "zsh"]], ["3", "Compose small tools", "Use stdout, stderr, pipes, command substitution and redirection intentionally.", "Count tracked TypeScript files with git ls-files and wc; explain why node_modules is excluded.", ["git", "zsh"]], ["4", "Inspect before changing", "Use dry-runs, diffs, explicit paths and narrow queries.", "Stage two separate hunks with git add -p and inspect git diff --staged.", ["git", "rsync"]], ["5", "Debug from evidence", "Check directory, executable, runtime, environment, port, logs and resource pressure.", "Diagnose a failed dev-server start using whence -va, lsof and the project log.", ["lsof", "pnpm"]], ["6", "Manage repeatable environments", "Understand which layer owns what: the system package manager, the runtime manager, the project manager and containers.", "Explain which layer owns Node, React, Python, PHP and WordPress on your machine, and what breaks if two layers install the same thing.", ["uv", "Volta", "Docker"]], ["7", "Automate and recover", "Write small scripts, check exits, preserve backups, use worktrees and document operations.", "Create a read-only project-health script and test it in a directory whose name contains spaces.", ["zsh", "git"]], ["8", "Measure improvements", "Compare real workloads, change one thing at a time, and be honest about what a measurement proves.", "Use hyperfine on two harmless searches, then explain what the result does and does not prove.", ["hyperfine"]]], "tools": [{"name": "zsh", "tier": "Essential", "description": "The shell every example in this handbook is written for.", "commands": ["zsh"], "url": "https://zsh.sourceforge.io/Doc/Release/", "note": "Default on macOS since Catalina. On Linux, install it and then run chsh -s \"$(command -v zsh)\" to make it your login shell.", "install": {"brew": "zsh", "apt": "zsh", "dnf": "zsh", "pacman": "zsh"}}, {"name": "zsh-autosuggestions", "tier": "Recommended", "description": "Suggests the rest of a command from your history as you type.", "commands": [], "url": "https://github.com/zsh-users/zsh-autosuggestions", "note": "A plugin, not a command. It has to be sourced from your .zshrc; the package description prints the path to source.", "install": {"brew": "zsh-autosuggestions", "apt": "zsh-autosuggestions", "dnf": "zsh-autosuggestions", "pacman": "zsh-autosuggestions"}}, {"name": "zsh-syntax-highlighting", "tier": "Recommended", "description": "Colours a command line as valid or invalid before you press Enter.", "commands": [], "url": "https://github.com/zsh-users/zsh-syntax-highlighting", "note": "Source it last in your .zshrc, after every other plugin, or it will not see later keybindings.", "install": {"brew": "zsh-syntax-highlighting", "apt": "zsh-syntax-highlighting", "dnf": "zsh-syntax-highlighting", "pacman": "zsh-syntax-highlighting"}}, {"name": "direnv", "tier": "Optional", "description": "Loads and unloads environment variables when you enter or leave a directory.", "commands": ["direnv"], "url": "https://direnv.net/", "note": "Needs a shell hook in your .zshrc. It executes .envrc files, so only allow them in repositories you trust.", "install": {"brew": "direnv", "apt": "direnv", "dnf": "direnv", "pacman": "direnv"}}, {"name": "fzf", "tier": "Essential", "description": "Fuzzy finder. Provides Ctrl+R history search and Ctrl+T file search.", "commands": ["fzf"], "url": "https://github.com/junegunn/fzf", "note": "The key bindings are a separate setup step; see the project README for the line to add to your .zshrc.", "install": {"brew": "fzf", "apt": "fzf", "dnf": "fzf", "pacman": "fzf"}}, {"name": "zoxide", "tier": "Essential", "description": "Directory jumper that learns where you actually work. Provides z and zi.", "commands": ["zoxide", "z", "zi"], "url": "https://github.com/ajeetdsouza/zoxide", "note": "Needs eval \"$(zoxide init zsh)\" in your .zshrc. Older Debian and Ubuntu releases ship a version without zi.", "install": {"brew": "zoxide", "apt": "zoxide", "dnf": "zoxide", "pacman": "zoxide"}}, {"name": "fd", "tier": "Essential", "description": "Fast, sensible file finder. A friendlier front end than find.", "commands": ["fd"], "url": "https://github.com/sharkdp/fd", "note": "On Debian and Ubuntu the binary is installed as fdfind; alias fd=fdfind or symlink it.", "install": {"brew": "fd", "apt": "fd-find", "dnf": "fd-find", "pacman": "fd"}}, {"name": "ripgrep", "tier": "Essential", "description": "Fast recursive content search that respects .gitignore.", "commands": ["rg"], "url": "https://github.com/BurntSushi/ripgrep", "note": "", "install": {"brew": "ripgrep", "apt": "ripgrep", "dnf": "ripgrep", "pacman": "ripgrep"}}, {"name": "eza", "tier": "Recommended", "description": "Modern ls replacement with colours, icons, tree view and Git status.", "commands": ["eza"], "url": "https://github.com/eza-community/eza", "note": "Not in older Debian and Ubuntu archives; the project documents an apt repository for those releases.", "install": {"brew": "eza", "apt": "eza", "dnf": "eza", "pacman": "eza"}}, {"name": "bat", "tier": "Recommended", "description": "cat with syntax highlighting, line numbers and paging.", "commands": ["bat"], "url": "https://github.com/sharkdp/bat", "note": "On Debian and Ubuntu the binary is installed as batcat; alias bat=batcat or symlink it.", "install": {"brew": "bat", "apt": "bat", "dnf": "bat", "pacman": "bat"}}, {"name": "tree", "tier": "Optional", "description": "Prints a directory as an indented tree.", "commands": ["tree"], "url": "https://oldmanprogrammer.net/source.php?dir=projects/tree", "note": "", "install": {"brew": "tree", "apt": "tree", "dnf": "tree", "pacman": "tree"}}, {"name": "glow", "tier": "Optional", "description": "Renders Markdown readably in the terminal.", "commands": ["glow"], "url": "https://github.com/charmbracelet/glow", "note": "Packaged on Arch and Fedora; on Debian and Ubuntu use the Charm apt repository or a release binary.", "install": {"brew": "glow", "apt": "glow", "dnf": "glow", "pacman": "glow"}}, {"name": "tealdeer", "tier": "Recommended", "description": "Fast client for tldr, the community cheat sheets. Provides tldr.", "commands": ["tldr"], "url": "https://github.com/tealdeer-rs/tealdeer", "note": "Run tldr --update once after installing to fetch the page cache.", "install": {"brew": "tealdeer", "apt": "tealdeer", "dnf": "tealdeer", "pacman": "tealdeer"}}, {"name": "jq", "tier": "Essential", "description": "Query and reshape JSON on the command line.", "commands": ["jq"], "url": "https://jqlang.github.io/jq/manual/", "note": "", "install": {"brew": "jq", "apt": "jq", "dnf": "jq", "pacman": "jq"}}, {"name": "yq", "tier": "Recommended", "description": "The same idea as jq, for YAML, TOML and XML.", "commands": ["yq"], "url": "https://mikefarah.gitbook.io/yq/", "note": "Debian, Ubuntu and Fedora package a different, Python-based yq. For the Go yq used here, install the release binary from the project page.", "install": {"brew": "yq", "apt": "", "dnf": "", "pacman": "go-yq"}}, {"name": "jless", "tier": "Optional", "description": "Pager for large JSON documents. Fold, search and navigate instead of scrolling.", "commands": ["jless"], "url": "https://jless.io/", "note": "Not packaged on Debian, Ubuntu or Fedora; install with cargo install jless or a release binary.", "install": {"brew": "jless", "apt": "", "dnf": "", "pacman": "jless"}}, {"name": "sd", "tier": "Optional", "description": "Find and replace with plain syntax. An easier sed for simple substitutions.", "commands": ["sd"], "url": "https://github.com/chmln/sd", "note": "sd rewrites files in place. Preview with ripgrep first; it has no undo.", "install": {"brew": "sd", "apt": "sd", "dnf": "rust-sd", "pacman": "sd"}}, {"name": "tokei", "tier": "Optional", "description": "Counts lines of code by language.", "commands": ["tokei"], "url": "https://github.com/XAMPPRocky/tokei", "note": "", "install": {"brew": "tokei", "apt": "tokei", "dnf": "tokei", "pacman": "tokei"}}, {"name": "git", "tier": "Essential", "description": "Version control. The handbook assumes a recent version.", "commands": ["git"], "url": "https://git-scm.com/docs", "note": "macOS ships an Xcode version of Git. Installing it via Homebrew keeps it current.", "install": {"brew": "git", "apt": "git", "dnf": "git", "pacman": "git"}}, {"name": "gh", "tier": "Recommended", "description": "GitHub from the terminal: pull requests, issues, releases, CI runs.", "commands": ["gh"], "url": "https://cli.github.com/manual/", "note": "Debian, Ubuntu and Fedora need the "}}, {"name": "dust", "tier": "Optional", "description": "Shows which directories are actually using your disk.", "commands": ["dust"], "url": "https://github.com/bootandy/dust", "note": "The Debian, Ubuntu and Fedora package is named du-dust; the binary is still dust.", "install": {"brew": "dust", "apt": "du-dust", "dnf": "du-dust", "pacman": "dust"}}, {"name": "duf", "tier": "Optional", "description": "Readable df: free space per filesystem.", "commands": ["duf"], "url": "https://github.com/muesli/duf", "note": "", "install": {"brew": "duf", "apt": "duf", "dnf": "duf", "pacman": "duf"}}, {"name": "lsof", "tier": "Essential", "description": "Lists open files and sockets. How you find what is holding a port.", "commands": ["lsof"], "url": "https://github.com/lsof-org/lsof", "note": "Already present on macOS. On Linux, ss -tlnp from iproute2 answers the same port question and is usually installed.", "install": {"brew": "", "apt": "lsof", "dnf": "lsof", "pacman": "lsof"}}, {"name": "hyperfine", "tier": "Optional", "description": "Benchmarks commands with warmup runs and statistics.", "commands": ["hyperfine"], "url": "https://github.com/sharkdp/hyperfine", "note": "", "install": {"brew": "hyperfine", "apt": "hyperfine", "dnf": "hyperfine", "pacman": "hyperfine"}}, {"name": "watchexec", "tier": "Optional", "description": "Re-runs a command when files change.", "commands": ["watchexec"], "url": "https://github.com/watchexec/watchexec", "note": "Not in the Debian or Ubuntu archives; use cargo install watchexec-cli or a release binary.", "install": {"brew": "watchexec", "apt": "", "dnf": "watchexec", "pacman": "watchexec"}}, {"name": "trash", "tier": "Recommended", "description": "Deletes to the desktop trash instead of unlinking. A safer rm for interactive use.", "commands": ["trash"], "url": "https://github.com/sindresorhus/trash-cli", "note": "These are two different projects with the same idea. On Linux the command is usually trash-put.", "install": {"brew": "trash", "apt": "trash-cli", "dnf": "trash-cli", "pacman": "trash-cli"}}, {"name": "curl", "tier": "Essential", "description": "Transfers data over HTTP and many other protocols.", "commands": ["curl"], "url": "https://curl.se/docs/manpage.html", "note": "", "install": {"brew": "curl", "apt": "curl", "dnf": "curl", "pacman": "curl"}}, {"name": "wget", "tier": "Optional", "description": "Downloads files, including recursive mirroring.", "commands": ["wget"], "url": "https://www.gnu.org/software/wget/manual/", "note": "", "install": {"brew": "wget", "apt": "wget", "dnf": "wget", "pacman": "wget"}}, {"name": "xh", "tier": "Optional", "description": "Friendly HTTP client for testing APIs. Prints headers and JSON readably.", "commands": ["xh"], "url": "https://github.com/ducaale/xh", "note": "Not in the Debian or Ubuntu archives; use the release binary from the project page.", "install": {"brew": "xh", "apt": "", "dnf": "xh", "pacman": "xh"}}, {"name": "neovim", "tier": "Recommended", "description": "The editor the handbook assumes when it says \"open the file\".", "commands": ["nvim"], "url": "https://neovim.io/doc/", "note": "Distribution packages lag upstream. If a plugin requires a newer Neovim, use the official AppImage or release archive.", "install": {"brew": "neovim", "apt": "neovim", "dnf": "neovim", "pacman": "neovim"}}, {"name": "tmux", "tier": "Optional", "description": "Keeps shell sessions alive across disconnects and splits one terminal into panes.", "commands": ["tmux"], "url": "https://github.com/tmux/tmux/wiki", "note": "", "install": {"brew": "tmux", "apt": "tmux", "dnf": "tmux", "pacman": "tmux"}}, {"name": "uv", "tier": "Recommended", "description": "Installs Python versions, manages project environments and runs isolated CLI tools.", "commands": ["uv", "uvx"], "url": "https://docs.astral.sh/uv/", "note": "On Debian, Ubuntu and older Fedora, use the official installer at https://astral.sh/uv/install.sh after reading it.", "install": {"brew": "uv", "apt": "", host kernel. An alternative to Docker Desktop.", "install": {"brew": "colima", "apt": "", "dnf": "", "pacman": ""}}, {"name": "lazydocker", "tier": "Optional", "description": "Full-screen view of containers, logs and resource use.", "commands": ["lazydocker"], "url": "https://github.com/jesseduffield/lazydocker", "note": "Not in the Debian, Ubuntu or Fedora archives; use the release binary from the project page.", "install": {"brew": "lazydocker", "apt": "", "dnf": "", "pacman": "lazydocker"}}, {"name": "dive", "tier": "Optional", "description": "Inspects an image layer by layer to find what is making it large.", "commands": ["dive"], "url": "https://github.com/wagoodman/dive", "note": "Not in the Debian, Ubuntu or Fedora archives; the project publishes .deb and .rpm packages.", "install": {"brew": "dive", "apt": "", "dnf": "", "pacman": "dive"}}, {"name": "hadolint", "tier": "Optional", "description": "Lints Dockerfiles for common mistakes.", "commands": ["hadolint"], "url": "https://github.com/hadolint/hadolint", "note": "Packaged on Arch via the AUR; elsewhere use the release binary from the project page.", "install": {"brew": "hadolint", "apt": "", "dnf": "", "pacman": "hadolint-bin"}}, {"name": "kubernetes-cli", "tier": "Optional", "description": "Talks to a Kubernetes cluster. Provides kubectl.", "commands": ["kubectl"], "url": "https://kubernetes.io/docs/reference/kubectl/", "note": "Debian and Ubuntu need the Kubernetes apt repository first; the documentation covers the steps.", "install": {"brew": "kubernetes-cli", "apt": "kubectl", "dnf": "kubernetes-client", "pacman": "kubectl"}}, {"name": "k9s", "tier": "Optional", "description": "Full-screen Kubernetes browser for pods, logs and events.", "commands": ["k9s"], "url": "https://k9scli.io/", "note": "Not in the Debian, Ubuntu or Fedora archives; use the release binary from the project page.", "install": {"brew": "k9s", "apt": "", "dnf": "", "pacman": "k9s"}}, {"name": "helm", "tier": "Optional", "description": "Installs and upgrades packaged Kubernetes applications.", "commands": ["helm"], "url": "https://helm.sh/docs/", "note": "Debian and Ubuntu need the Helm apt repository; the documentation covers the steps.", "install": {"brew": "helm", "apt": "", "dnf": "", "pacman": "helm"}}, {"name": "ollama", "tier": "Optional", "description": "Downloads and runs language models locally.", "commands": ["ollama"], "url": "https://ollama.com/", "note": "On Debian, Ubuntu and Fedora, use the installer at https://ollama.com/install.sh after reading it. Models are large: check disk space first, and expect memory use in the same order as the model file.", "install": {"brew": "ollama", "apt": "", "dnf": "", "pacman": "ollama"}}, {"name": "llama.cpp", "tier": "Optional", "description": "Runs GGUF models directly. Provides llama-cli and llama-server.", "commands": ["llama-cli", "llama-server"], "url": "https://github.com/ggml-org/llama.cpp", "note": "Most Linux users build it from source to match their GPU; the repository documents the build flags.", "install": {"brew": "llama.cpp", "apt": "", "dnf": "", "pacman": "llama.cpp"}}, {"name": "imagemagick", "tier": "Optional", "description": "Converts, resizes and inspects images. Provides magick.", "commands": ["magick"], "url": "https://imagemagick.org/script/command-line-processing.php", "note": "", "install": {"brew": "imagemagick", "apt": "imagemagick", "dnf": "ImageMagick", "pacman": "imagemagick"}}, {"name": "ghostscript", "tier": "Optional", "description": "Processes PostScript and PDF. Provides gs.", "commands": ["gs"], "url": "https://www.ghostscript.com/documentation/", "note": "If you alias gs to git status, the alias wins. Call the full path to reach Ghostscript.", "install": {"brew": "ghostscript", "apt": "ghostscript", "dnf": "ghostscript", "pacman": "ghostscript"}}, {"name": "tesseract", "tier": "Optional", "description": "Extracts text from images (OCR).", "commands": ["tesseract"], "url": "https://tesseract-ocr.github.io/", "note": "Each language is a separate data package, for example tesseract-ocr-deu on Debian and Ubuntu.", "install": {"brew": "tesseract", "apt": "tesseract-ocr", "dnf": "tesseract", "pacman": "tesseract"}}], "managers": [["macOS", "Homebrew", "brew install", "https://brew.sh", "brew"], ["Debian / Ubuntu", "apt", "sudo apt install -y", "https://wiki.debian.org/Apt", "apt"], ["Fedora / RHEL", "dnf", "sudo dnf install -y", "https://dnf.readthedocs.io/", "dnf"], ["Arch", "pacman", "sudo pacman -S --needed", "https://wiki.archlinux.org/title/Pacman", "pacman"]], "extras": [["A terminal emulator", "Ghostty, WezTerm, Kitty and Alacritty are all GPU-accelerated and cross-platform. macOS Terminal, GNOME Console and Konsole run every command here too.", "https://ghostty.org/"], ["A Nerd Font", "Only needed if you want icons in a prompt or file listing. JetBrainsMono Nerd Font is a safe default. Install it, then select it in your terminal settings.", "https://www.nerdfonts.com/"], ["A prompt", "Starship and Oh My Posh both show Git state, runtime versions and exit status. Entirely optional: the handbook never depends on your prompt.", "https://starship.rs/"]], "categories": ["Shell foundations", "Find \u0026 navigate", "Git \u0026 GitHub", "Web development", "Containers \u0026 WordPress", "Python \u0026 local AI", "Data, files \u0026 media", "Networking \u0026 processes", "Editors \u0026 sessions", "Packages \u0026 maintenance", "macOS specifics", "Linux specifics"], "levels": ["Start", "Intermediate", "Advanced"], "effects": ["Inspect", "Run", "Write", "Destructive", "Remote write", "Disruptive", "Network"], "tiers": ["Essential", "Recommended", "Optional"]}</script>
<script>

'use strict';
const D=JSON.parse(document.getElementById('handbook-data').textContent);

function home(){return '<section class="hero"><div><div class="eyebrow">Read the command. Understand the result.</div><h1>Make the terminal<br><span class="accent">second nature.</span></h1><p>A practical field guide to the tools a working developer actually uses, on macOS and Linux. Every example says what it does, what it changes, and where to read more \u2014 so you stop pasting commands you cannot explain.</p><div class="hero-actions"><button class="button primary" data-view="commands">Explore commands \u2197</button><button class="button ghost" data-view="learn">Build your skills</button></div></div><div class="terminal" aria-label="Example terminal session"><div class="terminal-bar"><i></i><i></i><i></i><span>zsh</span></div><div class="terminal-body"><div class="terminal-row"><span class="prompt-pill"></span><span class="prompt-folder">~/projects</span><br><span class="accent">\u276f</span> whence -va ls<span class="output">ls: aliased to eza --icons</span></div><div class="terminal-row"><span class="prompt-pill"></span><span class="prompt-folder">your-app</span><br><span class="accent">\u276f</span> lsof -nP -iTCP:3000 -sTCP:LISTEN<span class="output">node  41822  LISTEN</span></div></div><div class="terminal-note">Two habits worth more than any alias:<br>find out what a command really is, and find out what is really running.</div></div></section><div class="stats"><div class="stat"><strong>'+D.recipes.length+'</strong><span>worked examples</span></div><div class="stat"><strong>'+D.tools.length+'</strong><span>tools, with install commands</span></div><div class="stat"><strong>'+D.workflows.length+'</strong><span>end-to-end workflows</span></div><div class="stat"><strong>'+D.lessons.length+'</strong><span>learning steps</span></div></div><div class="section-head"><div><h2>Start with what you\u2019re doing</h2><p>Ordinary tasks, written out as routines you can repeat.</p></div><button class="button ghost" data-view="workflows">All workflows</button></div><div class="grid">'+[0,1,3,5].map(i=>workflowCard(D.workflows[i],i)).join('')+'</div><div class="section-head"><div><h2>Small habits. A big difference.</h2><p>Know the directory. Read the command. Inspect the result.</p></div></div><div class="concepts"><h3>One job per layer</h3><p>A system package manager (<code>brew</code>, <code>apt</code>, <code>dnf</code>, <code>pacman</code>) installs workstation tools. A runtime manager (<code>volta</code>, <code>uv</code>) decides which Node or Python a project gets. A project manager (<code>pnpm</code>, <code>uv</code>) owns that project\u2019s dependencies. <code>Docker</code> provides services and other people\u2019s environments. Most confusing breakage comes from two layers installing the same thing.</p><p>Senior terminal use is not memorising flags. It is understanding state, narrowing changes, debugging from evidence, and being able to undo what you did. Speed is a side effect of those habits.</p></div><div class="notice">New machine? <button class="button ghost" data-view="install">Install the toolkit</button> lists every tool these examples use, with the exact command for Homebrew, apt, dnf and pacman \u2014 and says which ones you can skip.</div>'+footer()}

let terms=[];
const matches=(text)=>!terms.length||terms.every(q=>text.toLowerCase().includes(q));
function commands(){let list=D.recipes.filter(r=>(state.view!=='saved'||saved.has(r.id))&&(state.category==='All'||r.category===state.category)&&(state.level==='All'||r.level===state.level)&&(state.effect==='All'||r.effect===state.effect)&&matches([r.title,r.command,r.explanation,r.tool,r.category].join(' ')));return '<div class="eyebrow">Find it. Understand it. Use it.</div><h1 class="view-title" style="margin-top:12px">'+(state.view==='saved'?'Your saved commands':state.category==='All'?'Command library':esc(state.category))+'</h1><p class="intro">Copyable examples with context and side effects. Commands never execute in this page. Replace sample paths, names and IDs before running them.</p><div class="filters">'+select('category','Topic',['All',...D.categories],state.category)+select('level','Level',['All',...D.levels],state.level)+select('effect','Action',['All',...D.effects],state.effect)+'<span class="result-count" role="status">'+list.length+' examples</span></div>'+ (list.length?list.map(recipe).join(''):'<div class="empty"><strong>No commands match.</strong>Try a different term or reset the filters.<br><button class="button" style="margin-top:18px" data-reset>Reset filters</button></div>')+footer()}
function install(){const mgr=D.managers.map(([platform,name,cmd,url])=>'<tr><td>'+esc(platform)+'</td><td><a href="'+esc(safeURL(url))+'" target="_blank" rel="noopener noreferrer">'+esc(name)+'</a></td><td><code>'+esc(cmd)+' NAME</code></td></tr>').join('');const list=D.tools.filter(t=>(state.tier==='All'||t.tier===state.tier)&&matches([t.name,t.description,t.tier,t.note,...t.commands].join(' ')));const cell=(t,[platform,,prefix,,key])=>{const pkg=t.install[key];return '<tr><td>'+esc(platform)+'</td><td>'+(pkg?'<code>'+esc(prefix+' '+pkg)+'</code>':'<span class="muted">No standard package. See the note below.</span>')+'</td></tr>'};return '<div class="eyebrow">macOS and Linux</div><h1 style="margin-top:12px">Install the toolkit.</h1><p class="intro">Everything the command library uses. You do not need all of it: install the <strong>Essential</strong> tier first, add <strong>Recommended</strong> as you meet it, and leave <strong>Optional</strong> until a task actually calls for it. Check what you already have with <code>command -v NAME</code> before installing anything.</p><div class="table-wrap"><table><thead><tr><th>Platform</th><th>Package manager</th><th>Install a package</th></tr></thead><tbody>'+mgr+'</tbody></table></div><div class="notice">Package names are not the same everywhere, and a few packages install the binary under a different name \u2014 <code>fd</code> becomes <code>fdfind</code> on Debian and Ubuntu, <code>bat</code> becomes <code>batcat</code>. Each entry below says so where it applies. A blank cell means that distribution has no standard package; the note gives the alternative.</div><div class="filters">'+select('tier','Show',['All',...D.tiers],state.tier)+'<span class="result-count" role="status">'+list.length+' tools</span></div>'+list.map(t=>'<details class="package"><summary><span class="package-name">'+esc(t.name)+'</span><span class="badge '+(t.tier==='Essential'?'read':t.tier==='Recommended'?'write':'')+'">'+esc(t.tier)+'</span><span class="package-version">'+(t.commands.length?esc(t.commands.join(', ')):'no command of its own')+'</span></summary><p class="package-description">'+esc(t.description)+'</p><div class="package-body"><div class="table-wrap"><table><tbody>'+D.managers.map(m=>cell(t,m)).join('')+'</tbody></table></div>'+(t.note?'<p style="margin-top:14px">'+esc(t.note)+'</p>':'')+(t.commands.length?'<p style="margin-top:12px">Verify with '+t.commands.map(c=>'<code>command -v '+esc(c)+'</code>').join(' ')+'</p>':'')+(t.url?'<p style="margin-top:12px"><a href="'+esc(safeURL(t.url))+'" target="_blank" rel="noopener noreferrer">Official documentation \u2197</a></p>':'')+'</div></details>').join('')+(!list.length?'<div class="empty">No tool matches that search.</div>':'')+'<div class="section-head"><div><h2>Chosen, not required</h2><p>None of the commands in this handbook depend on these.</p></div></div>'+D.extras.map(([title,body,url])=>'<article class="extra-item"><div class="extra-label">OPTIONAL</div><div><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><p style="margin-top:10px"><a href="'+esc(safeURL(url))+'" target="_blank" rel="noopener noreferrer">Read more \u2197</a></p></div></article>').join('')+footer()}
function workflows(){return '<div class="eyebrow">From commands to outcomes</div><h1 style="margin-top:12px">Project workflows</h1><p class="intro">Follow a routine, inspect each result, and adapt it to the project. These sequences explain where commands fit together.</p><div class="grid">'+D.workflows.map(workflowCard).join('')+'</div>'+footer()}
function workflow(){const w=D.workflows[state.workflow];return '<div class="workflow-detail"><button class="button ghost back" data-view="workflows">← All workflows</button><div class="eyebrow">'+esc(w.tag)+'</div><h1 style="margin-top:12px">'+esc(w.title)+'</h1><p class="intro">'+esc(w.intro)+'</p>'+w.steps.map(([title,cmd],i)=>'<section class="step"><div class="step-number">0'+(i+1)+'</div><div><h3>'+esc(title)+'</h3>'+command(cmd)+'</div></section>').join('')+'<div class="notice">'+esc(w.finish)+'</div></div>'+footer()}
function learn(){return '<div class="eyebrow">Practice builds fluency</div><h1 style="margin-top:12px">A path to confidence.</h1><p class="intro">Work through these at your own pace. Mark a step complete when you can explain the command and its consequences without copying blindly. Progress stays in this browser.</p><p class="tip">'+completed.size+' of '+D.lessons.length+' steps completed</p><div class="progress" role="progressbar" aria-label="Learning progress" aria-valuemin="0" aria-valuemax="'+D.lessons.length+'" aria-valuenow="'+completed.size+'"><span style="width:'+completed.size/D.lessons.length*100+'%"></span></div><div class="learning-grid">'+D.lessons.map(([n,title,desc,exercise])=>'<article class="lesson '+(completed.has(n)?'done':'')+'"><div class="lesson-top"><span class="lesson-no">0'+n+'</span><h3>'+esc(title)+'</h3></div><p>'+esc(desc)+'</p><p class="exercise"><strong>Try it:</strong> '+esc(exercise)+'</p><label class="checkline"><input type="checkbox" data-lesson="'+n+'" '+(completed.has(n)?'checked':'')+'>I can explain and do this</label></article>').join('')+'</div><div class="concepts"><h3>Read a command as a sentence</h3><p><code>rg -n -F "process.env." -g "*.ts" .</code></p><p><strong>rg</strong> is the tool. <strong>-n</strong> adds line numbers. <strong>-F</strong> uses literal matching. The first quoted string is the pattern. <strong>-g</strong> selects filenames. <strong>.</strong> is the current directory. Quotes protect characters from interpretation by zsh.</p><p><strong>Pipes</strong> (<code>|</code>) connect stdout to stdin. <strong>2&gt;</strong> redirects stderr. <strong>&amp;&amp;</strong> runs the next command after success. <strong>;</strong> runs the next command regardless. <strong>$(...)</strong> captures stdout. <strong>&gt;</strong> writes a file and <strong>&gt;&gt;</strong> appends.</p><p>Setting <code>NO_CLOBBER</code> (<code>setopt noclobber</code>) stops <code>&gt;</code> from replacing an existing file, but it does not stop a program such as <code>sd</code> from editing one. macOS ships BSD versions of <code>sed</code>, <code>date</code> and <code>stat</code> while Linux ships the GNU versions, so the same flag can mean different things or not exist at all.</p></div>'+footer()}
function shortcuts(){return '<div class="eyebrow">Less typing. More intention.</div><h1 style="margin-top:12px">Keyboard shortcuts</h1><p class="intro">Default bindings for zsh, tmux and Neovim, plus one terminal emulator as an example. The zsh history and file-search bindings assume fzf is installed and hooked into your shell. On Linux, read Cmd as Ctrl in your terminal\u2019s own shortcuts.</p>'+[...new Set(D.shortcuts.map(s=>s[0]))].map(group=>'<section class="shortcut-group"><h3>'+esc(group)+'</h3><div class="table-wrap"><table><thead><tr><th>Keys</th><th>Action</th></tr></thead><tbody>'+D.shortcuts.filter(s=>s[0]===group).map(s=>'<tr><td><kbd>'+esc(s[1])+'</kbd></td><td>'+esc(s[2])+'</td></tr>').join('')+'</tbody></table></div></section>').join('')+'<div class="notice">An alias can shadow a real program. <code>gs</code> is a common alias for <code>git status</code>, but it is also Ghostscript\u2019s executable. <code>whence -va gs</code> shows every match, and <code>command gs</code> skips the alias.</div>'+footer()}
function render(){terms=state.query.toLowerCase().trim().split(/\s+/).filter(Boolean);navigation();main.innerHTML=({home,commands,saved:commands,install,workflows,workflow,learn,shortcuts}[state.view]||home)();document.title=(state.view==='home'?'Terminal Handbook':state.view[0].toUpperCase()+state.view.slice(1)+' \u00b7 Terminal Handbook')}
let toastTimer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400)}
async function copy(text,button){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy');button.focus()}button.textContent='Copied';toast('Copied. Review it before running.');setTimeout(()=>{if(button.isConnected)button.textContent='Copy'},1500)}catch{toast('Clipboard unavailable. Select and copy the command text.')}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),c=e.target.closest('[data-category]'),w=e.target.closest('[data-workflow]'),b=e.target.closest('[data-save]'),cp=e.target.closest('[data-copy]');if(v){setView(v.dataset.view)}else if(c){setView('commands',c.dataset.category)}else if(w){state.workflow=Number(w.dataset.workflow);setView('workflow')}else if(b){const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);storage.set('terminal-guide-saved',[...saved]);b.classList.toggle('saved',saved.has(id));b.textContent=saved.has(id)?'★':'☆';b.setAttribute('aria-pressed',String(saved.has(id)));b.setAttribute('aria-label',(saved.has(id)?'Unsave':'Save')+' command');navigation();if(state.view==='saved')render()}else if(cp){copy(cp.dataset.copy,cp)}else if(e.target.closest('[data-reset]')){state.category=state.level=state.effect='All';state.query='';search.value='';render()}});
document.addEventListener('change',e=>{if(['category','level','effect','tier'].includes(e.target.id)){state[e.target.id]=e.target.value;render()}if(e.target.matches('[data-lesson]')){const n=e.target.dataset.lesson;e.target.checked?completed.add(n):completed.delete(n);storage.set('terminal-guide-lessons',[...completed]);render()}});
let searchTimer;search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.query=search.value;if(!['commands','saved','install'].includes(state.view)){state.view='commands';state.category='All'}render()},120)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();search.focus()}if(e.key==='Escape'){search.blur();document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}});
document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});
render();

</script>
</body>
</html>
