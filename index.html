"printf"}, {"id": "shell-foundations-append-a-line", "category": "Shell foundations", "title": "Append a line", "command": "printf '%s\\n' 'another line' \u003e\u003e terminal-practice.txt", "explanation": "\u003e\u003e appends. Use \u003e| only when you deliberately want to overwrite despite NO_CLOBBER.", "level": "Start", "effect": "Write", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "printf"}, {"id": "shell-foundations-keep-spaces-safe-when-iterating", "category": "Shell foundations", "title": "Keep spaces safe when iterating", "command": "for file in *.md(N); do print -r -- \"$file\"; done", "explanation": "(N) makes an unmatched zsh glob expand to nothing. Quote the variable on use.", "level": "Advanced", "effect": "Inspect", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "for"}, {"id": "shell-foundations-see-shell-jobs", "category": "Shell foundations", "title": "See shell jobs", "command": "jobs -l", "explanation": "Ctrl+Z suspends a foreground job; fg resumes it. Ctrl+C asks the foreground process to stop.", "level": "Start", "effect": "Inspect", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "jobs"}, {"id": "shell-foundations-resume-a-suspended-job", "category": "Shell foundations", "title": "Resume a suspended job", "command": "fg", "explanation": "Return the most recently suspended shell job to the foreground.", "level": "Start", "effect": "Run", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "fg"}, {"id": "shell-foundations-check-shell-syntax", "category": "Shell foundations", "title": "Check shell syntax", "command": "zsh -n ~/.zshrc", "explanation": "Parse the config without executing it. This catches syntax errors, not every runtime problem.", "level": "Intermediate", "effect": "Inspect", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "zsh"}, {"id": "shell-foundations-start-a-clean-shell", "category": "Shell foundations", "title": "Start a clean shell", "command": "zsh -f", "explanation": "Start a shell without your normal startup files. Type exit to leave. Useful for isolating config bugs.", "level": "Intermediate", "effect": "Run", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "zsh"}, {"id": "shell-foundations-show-completion-paths", "category": "Shell foundations", "title": "Show completion paths", "command": "print -l -- $fpath", "explanation": "These directories contain completion functions, including Homebrew's site-functions directory.", "level": "Intermediate", "effect": "Inspect", "source": "https://zsh.sourceforge.io/Doc/Release/", "tool": "print"}, {"id": "shell-foundations-open-this-handbook", "category": "Shell foundations", "title": "Open this handbook", "command": "open index.html", "explanation": "Opens the handbook in your browser. It is a single file and works offline. On Linux, use xdg-open index.html.", "level": "Start", "effect": "Run", "source": "https://support.apple.com/guide/terminal/open-or-quit-terminal-trml35697/mac", "tool": "open"}, {"id": "find-navigate-save-a-jump-as-an-alias", "category": "Find \u0026 navigate", "title": "Save a jump as an alias", "command": "alias work='cd ~/projects'", "explanation": "An alias is a saved command. Add the line to your .zshrc to keep it after this session, then open a new shell.", "level": "Start", "effect": "Run", "source": "https://github.com/sharkdp/fd", "tool": "alias"}, {"id": "find-navigate-jump-by-remembered-name", "category": "Find \u0026 navigate", "title": "Jump by remembered name", "command": "z your-app", "explanation": "zoxide learns visited directories. zi opens an interactive picker. Visit the directory with cd first if it is unknown.", "level": "Start", "effect": "Run", "source": "https://github.com/ajeetdsouza/zoxide", "tool": "zoxide"}, {"id": "find-navigate-see-files-with-git-status", "category": "Find \u0026 navigate", "title": "See files with Git status", "command": "eza -lah --git --icons=auto", "explanation": "A detailed directory listing. Your ll alias does the same with icons always enabled.", "level": "Start", "effect": "Inspect", "source": "https://github.com/eza-community/eza", "tool": "eza"}, {"id": "find-navigate-explore-a-small-tree", "category": "Find \u0026 navigate", "title": "Explore a small tree", "command": "eza --tree --level=2 --git-ignore", "explanation": "Keep output shallow. --git-ignore removes entries ignored by Git.", "level": "Start", "effect": "Inspect", "source": "https://github.com/eza-community/eza", "tool": "eza"}, {"id": "find-navigate-find-files-by-name", "category": "Find \u0026 navigate", "title": "Find files by name", "command": "fd -e ts -e tsx", "explanation": "fd respects ignore files by default. It searches names, while rg searches file contents.", "level": "Start", "effect": "Inspect", "source": "https://github.com/sharkdp/fd", "tool": "fd"}, {"id": "find-navigate-find-hidden-config-files", "category": "Find \u0026 navigate", "title": "Find hidden config files", "command": "fd --hidden --exclude .git '^\\.env'", "explanation": "Lists names only; avoids printing secrets stored inside environment files.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/sharkdp/fd", "tool": "fd"}, {"id": "find-navigate-find-directories", "category": "Find \u0026 navigate", "title": "Find directories", "command": "fd --type d 'components'", "explanation": "Narrow by type to locate component directories quickly.", "level": "Start", "effect": "Inspect", "source": "https://github.com/sharkdp/fd", "tool": "fd"}, {"id": "find-navigate-find-text-in-source", "category": "Find \u0026 navigate", "title": "Find text in source", "command": "rg -n 'TODO|FIXME' -g '*.{ts,tsx,php,py}'", "explanation": "Show line numbers for matching source files. Quoting prevents the shell from interpreting the pattern.", "level": "Start", "effect": "Inspect", "source": "https://github.com/BurntSushi/ripgrep", "tool": "ripgrep"}, {"id": "find-navigate-search-literal-punctuation", "category": "Find \u0026 navigate", "title": "Search literal punctuation", "command": "rg -n -F 'process.env.'", "explanation": "-F treats the pattern as literal text, rather than a regular expression.", "level": "Start", "effect": "Inspect", "source": "https://github.com/BurntSushi/ripgrep", "tool": "ripgrep"}, {"id": "find-navigate-list-matching-files-only", "category": "Find \u0026 navigate", "title": "List matching files only", "command": "rg -l 'use client' -g '*.tsx'", "explanation": "Useful before opening files in your editor. -l prints each matching filename once.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/BurntSushi/ripgrep", "tool": "ripgrep"}, {"id": "find-navigate-count-matches", "category": "Find \u0026 navigate", "title": "Count matches", "command": "rg -c 'TODO' -g '*.ts'", "explanation": "Counts matching lines per file. Use --count-matches to count individual matches instead.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/BurntSushi/ripgrep", "tool": "ripgrep"}, {"id": "find-navigate-search-an-ignored-file-deliberately", "category": "Find \u0026 navigate", "title": "Search an ignored file deliberately", "command": "rg --no-ignore -n 'pattern' path/to/file", "explanation": "Replace the example path and pattern. Scope this tightly; searching every dependency is usually noise.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/BurntSushi/ripgrep", "tool": "ripgrep"}, {"id": "find-navigate-choose-a-file-interactively", "category": "Find \u0026 navigate", "title": "Choose a file interactively", "command": "fzf", "explanation": "Your fd default feeds ignored-aware file names into fzf. Ctrl+T inserts a selected path into the current command.", "level": "Start", "effect": "Inspect", "source": "https://github.com/junegunn/fzf", "tool": "fzf"}, {"id": "find-navigate-jump-with-a-directory-picker", "category": "Find \u0026 navigate", "title": "Jump with a directory picker", "command": "zi", "explanation": "Interactive zoxide selector for directories you have already visited. Alt+C is fzf's directory picker.", "level": "Start", "effect": "Run", "source": "https://github.com/ajeetdsouza/zoxide", "tool": "zoxide"}, {"id": "find-navigate-inspect-file-with-highlighting", "category": "Find \u0026 navigate", "title": "Inspect file with highlighting", "command": "bat --paging=never package.json", "explanation": "bat adds highlighting. ccat is your alias; ordinary cat remains available for scripts.", "level": "Start", "effect": "Inspect", "source": "https://github.com/sharkdp/bat", "tool": "bat"}, {"id": "find-navigate-read-just-part-of-a-file", "category": "Find \u0026 navigate", "title": "Read just part of a file", "command": "bat --line-range 1:100 package.json", "explanation": "Useful when reviewing a large source file or config.", "level": "Start", "effect": "Inspect", "source": "https://github.com/sharkdp/bat", "tool": "bat"}, {"id": "find-navigate-plain-portable-directory-tree", "category": "Find \u0026 navigate", "title": "Plain portable directory tree", "command": "tree -L 2 -I 'node_modules|vendor|.git'", "explanation": "tree is also installed. The exclusion expression prevents huge dependency listings.", "level": "Start", "effect": "Inspect", "source": "https://oldmanprogrammer.net/source.php?dir=projects/tree", "tool": "tree"}, {"id": "find-navigate-count-your-codebase", "category": "Find \u0026 navigate", "title": "Count your codebase", "command": "tokei . --exclude node_modules --exclude vendor", "explanation": "Shows source line counts by language. Size is a navigation aid, not a quality score.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/XAMPPRocky/tokei", "tool": "tokei"}, {"id": "git-github-understand-current-changes", "category": "Git \u0026 GitHub", "title": "Understand current changes", "command": "git status --short --branch", "explanation": "Your gss alias gives short status; gs gives the h --decorate -15", "explanation": "Your glog alias shows a similar graph. A compact history helps before a rebase or merge.", "level": "Start", "effect": "Inspect", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "git-github-fetch-remote-changes", "category": "Git \u0026 GitHub", "title": "Fetch remote changes", "command": "git fetch --prune", "explanation": "Updates remote-tracking refs and prunes stale ones. It does not merge into your working branch.", "level": "Intermediate", "effect": "Write", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "git-github-understand-upstream-differences", "category": "Git \u0026 GitHub", "title": "Understand upstream differences", "command": "git log --oneline --left-right HEAD...@{upstream}", "explanation": "Requires a configured upstream. Left entries are local-only; right entries are upstream-only.", "level": "Intermediate", "effect": "Inspect", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "git-github-unstage-without-losing-edits", "category": "Git \u0026 GitHub", "title": "Unstage without losing edits", "command": "git restore --staged path/to/file", "explanation": "Replace the example path. This changes the index and preserves working-tree content.", "level": "Start", "effect": "Write", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "git-github-discard-a-file-s-local-edits", "category": "Git \u0026 GitHub", "title": "Discard a file's local edits", "command": "git restore -- path/to/file", "explanation": "Replaces uncommitted working-tree content. Inspect git diff first; ordinary Git may not recover these edits.", "level": "Intermediate", "effect": "Destructive", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "git-github-find-when-a-line-changed", "category": "Git \u0026 GitHub", "title": "Find when a line changed", "command": "git blame -L 1,60 -- path/to/file", "explanation": "Replace the path. Follow up with git show COMMIT to understand the reason for a ry": "Git \u0026 GitHub", "title": "Use a Git dashboard", "command": "lazygit", "explanation": "Interactive status, hunk staging, history and branches. Read on-screen bindings before performing actions.", "level": "Start", "effect": "Run", "source": "https://github.com/jesseduffield/lazygit", "tool": "lazygit"}, {"id": "git-github-inspect-large-file-tracking", "category": "Git \u0026 GitHub", "title": "Inspect large-file tracking", "command": "git lfs ls-files", "explanation": "Lists files tracked by Git LFS. LFS stores pointers in Git and file content separately.", "level": "Intermediate", "effect": "Inspect", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "git-github-check-github-login", "category": "Git \u0026 GitHub", "title": "Check GitHub login", "command": "gh auth status", "explanation": "Reports authentication status without requesting token output.", "level": "Start", "effect": "Inspect", "source": "https://cli.github.com/manual/", "tool": "gh"}, {"id": "git-github-list-your-pull-requests", "category": "Git \u0026 GitHub", "title": "List your pull requests", "command": "gh pr list --author @me", "explanation": "Run in the relevant GitHub repository.", "level": "Start", "effect": "Inspect", "source": "https://cli.github.com/manual/", "tool": "gh"}, {"id": "git-github-review-a-pull-request-locally", "category": "Git \u0026 GitHub", "title": "Review a pull request locally", "command": "gh pr diff 123", "explanation": "Replace 123 with a real PR number; prints its patch.", "level": "Intermediate", "effect": "Inspect", "source": "https://cli.github.com/manual/", "tool": "gh"}, {"id": "git-github-check-ci-for-a-pr", "category": "Git \u0026 GitHub", "title": "Check CI for a PR", "command": "gh pr checks 123", "explanation": "Shows check status. Use gh run list to explore recent workflow runs.", "level": "Intermediate", "effect": "Inspect", "source": "https://cli.github.com/manual/", "tool": "gh"}, {"id": "git-github-inspect-failed-ci-logs", "category": "Git \u0026 GitHub", "title": "Inspect failed CI logs", "command": "gh run view RUN_ID --log-failed", "explanation": "Replace RUN_ID with a real run ID from gh run list. Logs may contain sensitive project details.", "level": "Intermediate", "effect": "Inspect", "source": "https://cli.github.com/manual/", "tool": "gh"}, {"id": "git-github-create-a-draft-pr", "category": "Git \u0026 GitHub", "title": "Create a draft PR", "command": "gh pr create --draft", "explanation": "Opens an interactive draft-PR flow and sends content to GitHub. Review title, body and target branch.", "level": "Intermediate", "effect": "Remote write", "source": "https://cli.github.com/manual/", "tool": "gh"}, {"id": "web-development-check-runtime-selection", "category": "Web development", "title": "Check runtime selection", "command": "volta list", "explanation": "Shows the default Node and the tools Volta manages. Without Volta, use node --version and which -a node.", "level": "Start", "effect": "Inspect", "source": "https://docs.volta.sh/reference/", "tool": "volta"}, {"id": "web-development-see-the-actual-node-binary", "category": "Web development", "title": "See the actual Node binary", "command": "volta which node", "explanation": "Shows the executable Volta would select in the current project.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.volta.sh/reference/", "tool": "volta"}, {"id": "web-development-list-project-scripts", "category": "Web development", "title": "List project scripts", "command": "pnpm run", "explanation": "With no script, pnpm lists the scripts declared in package.json. Use this before assuming test or dev exists.", "level": "Start", "effect": "Inspect", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-install-the-locked-dependencies", "category": "Web development", "title": "Install the locked dependencies", "command": "pnpm install --frozen-lockfile", "explanation": "Run in a pnpm project with a current lockfile. Refuses changes to the lockfile; installs dependencies.", "level": "Intermediate", "effect": "Write", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-start-a-development-server", "category": "Web development", "title": "Start a development server", "command": "cd ~/projects/your-app\npnpm dev", "explanation": "Starts the project's dev script. Databases and environment variables still need to be available. Ctrl+C stops it.", "level": "Start", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-match-the-project-s-package-manager", "category": "Web development", "title": "Match the project's package manager", "command": "ls pnpm-lock.yaml package-lock.json yarn.lock 2\u003e/dev/null", "explanation": "The lockfile tells you which package manager the project uses. Mixing them produces inconsistent installs.", "level": "Start", "effect": "Inspect", "source": "https://pnpm.io/cli/run", "tool": "ls"}, {"id": "web-development-check-types", "category": "Web development", "title": "Check types", "command": "pnpm typecheck", "explanation": "Runs TypeScript without emitting JavaScript, if the project declares the script. pnpm run lists what exists.", "level": "Start", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-lint-project-code", "category": "Web development", "title": "Lint project code", "command": "pnpm lint", "explanation": "Runs the project's linter. Fix the underlying issue rather than suppressing the rule globally.", "level": "Start", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-build-for-production", "category": "Web development", "title": "Build for production", "command": "pnpm build", "explanation": "Runs the project's build, writing output such as .next. A build can require services and environment variables.", "level": "Intermediate", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-run-unit-tests", "category": "Web development", "title": "Run unit tests", "command": "pnpm test", "explanation": "Executes the project's test script. Read package.json to see which runner it uses.", "level": "Intermediate", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-run-browser-tests", "category": "Web development", "title": "Run browser tests", "command": "pnpm test:e2e", "explanation": "Runs end-to-end tests where the project declares them. Browsers, test data and a running server usually have to be set up first.", "level": "Intermediate", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-explain-a-dependency", "category": "Web development", "title": "Explain a dependency", "command": "pnpm why react", "explanation": "Find which dependency brings a package into the graph. Better than adding duplicate global packages.", "level": "Intermediate", "effect": "Inspect", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-inspect-direct-versions", "category": "Web development", "title": "Inspect direct versions", "command": "pnpm list --depth 0", "explanation": "Lists top-level packages in the current project.", "level": "Start", "effect": "Inspect", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-inspect-outdated-dependencies", "category": "Web development", "title": "Inspect outdated dependencies", "command": "pnpm outdated", "explanation": "Read the available versions before choosing an upgrade. A nonzero exit can indicate outdated packages.", "level": "Intermediate", "effect": "Inspect", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-use-a-project-executable", "category": "Web development", "title": "Use a project executable", "command": "pnpm exec tsc --noEmit", "explanation": "Runs the locally installed executable. It does not install a new CLI like pnpm dlx may do.", "level": "Intermediate", "effect": "Run", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-pin-node-intentionally", "category": "Web development", "title": "Pin Node intentionally", "command": "volta pin node@22", "explanation": "Writes a Volta pin into package.json so everyone on the project gets that Node. Agree on it with the repository first.", "level": "Advanced", "effect": "Write", "source": "https://docs.volta.sh/reference/", "tool": "volta"}, {"id": "web-development-run-any-declared-script", "category": "Web development", "title": "Run any declared script", "command": "pnpm run build:types", "explanation": "Replace build:types with a script from pnpm run. Generated output is written into the project.", "level": "Intermediate", "effect": "Write", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "web-development-inspect-npm-globals", "category": "Web development", "title": "Inspect npm globals", "command": "npm list -g --depth=0", "explanation": "A diagnostic inventory. Keep application dependencies in their projects.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.npmjs.com/cli/", "tool": "volta"}, {"id": "containers-wordpress-check-the-vm-macos", "category": "Containers \u0026 WordPress", "title": "Check the VM (macOS)", "command": "colima status", "explanation": "On macOS, Docker needs a Linux VM. Colima reports its CPU, memory and mount settings. On Linux there is no VM: containers use the host kernel.", "level": "Start", "effect": "Inspect", "source": "https://github.com/abiosoft/colima", "tool": "colima"}, {"id": "containers-wordpress-check-docker-s-destination", "category": "Containers \u0026 WordPress", "title": "Check Docker's destination", "command": "docker context show", "explanation": "Shows which engine your docker commands reach. A context name is not proof that anything is running.", "level": "Start", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-list-docker-contexts", "category": "Containers \u0026 WordPress", "title": "List Docker contexts", "command": "docker context ls", "explanation": "Verify the target before running commands, especially if remote contexts are added later.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-start-the-container-vm-macos", "category": "Containers \u0026 WordPress", "title": "Start the container VM (macOS)", "command": "colima start", "explanation": "Starts the Colima profile. It does not start your project stacks. The Linux equivalent is sudo systemctl start docker.", "level": "Start", "effect": "Run", "source": "https://github.com/abiosoft/colima", "tool": "colima"}, {"id": "containers-wordpress-stop-the-container-vm-macos", "category": "Containers \u0026 WordPress", "title": "Stop the container VM (macOS)", "command": "colima stop", "explanation": "Stops every container in that VM. Useful when you want the memory back for something else; save running work first.", "level": "Intermediate", "effect": "Disruptive", "source": "https://github.com/abiosoft/colima", "tool": "colima"}, {"id": "containers-wordpress-list-running-containers", "category": "Containers \u0026 WordPress", "title": "List running containers", "command": "docker ps", "explanation": "Add -a to include stopped containers. Nothing running is a valid result.", "level": "Start", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-see-project-service-names", "category": "Containers \u0026 WordPress", "title": "See project service names", "command": "docker compose config --services", "explanation": "Run from the compose directory. Unlike full config output, this does not print interpolated environment secrets.", "level": "Start", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-validate-compose-config", "category": "Containers \u0026 WordPress", "title": "Validate Compose config", "command": "docker compose config --quiet", "explanation": "Checks the project's resolved configuration without printing it.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-start-a-wordpress-site", "category": "Containers \u0026 WordPress", "title": "Start a WordPress site", "command": "cd ~/projects/your-wordpress-site\ndocker compose up -d", "explanation": "Starts the project's services, downloading images and creating volumes if needed. The site's .env has to be configured first.", "level": "Start", "effect": "Run", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-check-one-site-s-status", "category": "Containers \u0026 WordPress", "title": "Check one site's status", "command": "docker compose ps", "explanation": "Run from that site's directory.", "level": "Start", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-follow-recent-site-logs", "category": "Containers \u0026 WordPress", "title": "Follow recent site logs", "command": "docker compose logs --tail=100 -f wordpress", "explanation": "Ctrl+C leaves the log stream without stopping the containers. Logs can contain request details.", "level": "Start", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-check-wordpress-plugins", "category": "Containers \u0026 WordPress", "title": "Check WordPress plugins", "command": "docker compose exec wpcli wp plugin list", "explanation": "Assumes the stack defines a wpcli service. Running WP-CLI in the container keeps the PHP and WordPress versions aligned with the site.", "level": "Start", "effect": "Inspect", "source": "https://developer.wordpress.org/cli/commands/", "tool": "wp"}, {"id": "containers-wordpress-check-wordpress-core", "category": "Containers \u0026 WordPress", "title": "Check WordPress core", "command": "docker compose exec wpcli wp core version", "explanation": "Runs in the matching container environment, avoiding global PHP-version drift.", "level": "Start", "effect": "Inspect", "source": "https://developer.wordpress.org/cli/commands/", "tool": "wp"}, {"id": "containers-wordpress-list-wordpress-options-selectively", "category": "Containers \u0026 WordPress", "title": "List WordPress options selectively", "command": "docker compose exec wpcli wp option get siteurl", "explanation": "Query one known option; avoid dumping all options, which can contain secrets.", "level": "Intermediate", "effect": "Inspect", "source": "https://developer.wordpress.org/cli/commands/", "tool": "wp"}, {"id": "containers-wordpress-preview-a-url-migration", "category": "Containers \u0026 WordPress", "title": "Preview a URL migration", "command": "docker compose exec wpcli wp search-replace 'https://old.example' 'https://new.example' --all-tables-with-prefix --skip-columns=guid --dry-run", "explanation": "Replace the example URLs. Keep --dry-run until you have reviewed the result and backed up the database.", "level": "Advanced", "effect": "Inspect", "source": "https://developer.wordpress.org/cli/commands/", "tool": "wp"}, {"id": "containers-wordpress-export-a-wordpress-database", "category": "Containers \u0026 WordPress", "title": "Export a WordPress database", "command": "docker compose exec wpcli wp db export db-seed/manual-backup.sql", "explanation": "Writes a potentially sensitive SQL backup to the mounted db-seed directory. Choose a new filename and keep it out of Git.", "level": "Intermediate", "effect": "Write", "source": "https://developer.wordpress.org/cli/commands/", "tool": "wp"}, {"id": "containers-wordpress-stop-a-project-keep-its-data", "category": "Containers \u0026 WordPress", "title": "Stop a project, keep its data", "command": "docker compose stop", "explanation": "Stops containers without removing them or volumes. up -d starts them again.", "level": "Start", "effect": "Disruptive", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-remove-stopped-project-containers", "category": "Containers \u0026 WordPress", "title": "Remove stopped project containers", "command": "docker compose down", "explanation": "Removes project containers and networks. Do not add --volumes unless deliberately deleting database volumes.", "level": "Intermediate", "effect": "Disruptive", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-inspect-docker-disk-use", "category": "Containers \u0026 WordPress", "title": "Inspect Docker disk use", "command": "docker system df -v", "explanation": "Reports images, containers, volumes and cache. Reclaimable volumes may still hold important databases.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-inspect-live-container-resources", "category": "Containers \u0026 WordPress", "title": "Inspect live container resources", "command": "docker stats --no-stream", "explanation": "Takes a single CPU/memory snapshot of running containers.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-inspect-image-layers", "category": "Containers \u0026 WordPress", "title": "Inspect image layers", "command": "dive IMAGE:TAG", "explanation": "Replace IMAGE:TAG with an image listed by docker image ls. Helps find oversized layers.", "level": "Advanced", "effect": "Inspect", "source": "https://github.com/wagoodman/dive", "tool": "dive"}, {"id": "containers-wordpress-lint-a-dockerfile", "category": "Containers \u0026 WordPress", "title": "Lint a Dockerfile", "command": "hadolint Dockerfile", "explanation": "Runs the installed Dockerfile linter on the local file.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/hadolint/hadolint", "tool": "hadolint"}, {"id": "containers-wordpress-inspect-the-build-engine", "category": "Containers \u0026 WordPress", "title": "Inspect the build engine", "command": "docker buildx ls", "explanation": "Lists builders and platforms before a multi-platform build.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.docker.com/reference/cli/docker/", "tool": "docker"}, {"id": "containers-wordpress-docker-dashboard", "category": "Containers \u0026 WordPress", "title": "Docker dashboard", "command": "lazydocker", "explanation": "Interactive container/log/resource UI. It includes actions that can stop or remove workloads.", "level": "Start", "effect": "Run", "source": "https://github.com/jesseduffield/lazydocker", "tool": "lazydocker"}, {"id": "containers-wordpress-inspect-kubernetes-context", "category": "Containers \u0026 WordPress", "title": "Inspect Kubernetes context", "command": "kubectl config current-context", "explanation": "Tells you which cluster the next kubectl command would hit. An error here usually means no kubeconfig, not a broken install.", "level": "Intermediate", "effect": "Inspect", "source": "https://kubernetes.io/docs/reference/kubectl/", "tool": "kubernetes-cli"}, {"id": "containers-wordpress-inspect-kubernetes-workloads", "category": "Containers \u0026 WordPress", "title": "Inspect Kubernetes workloads", "command": "kubectl get pods -A", "explanation": "Contacts the active cluster and lists pods in every namespace. Check the context before you run it.", "level": "Intermediate", "effect": "Inspect", "source": "https://kubernetes.io/docs/reference/kubectl/", "tool": "kubernetes-cli"}, {"id": "containers-wordpress-list-helm-releases", "category": "Containers \u0026 WordPress", "title": "List Helm releases", "command": "helm list --all-namespaces", "explanation": "Read-only cluster query; requires a configured reachable Kubernetes cluster.", "level": "Intermediate", "effect": "Inspect", "source": "https://helm.sh/docs/", "tool": "helm"}, {"id": "containers-wordpress-kubernetes-dashboard", "category": "Containers \u0026 WordPress", "title": "Kubernetes dashboard", "command": "k9s --readonly", "explanation": "Opens the read-only dashboard for the selected context.", "level": "Advanced", "effect": "Inspect", "source": "https://k9scli.io/", "tool": "k9s"}, {"id": "python-local-ai-list-installed-python-runtimes", "category": "Python \u0026 local AI", "title": "List installed Python runtimes", "command": "uv python list --only-installed", "explanation": "A machine usually has several Pythons: the system one, a package-manager one and uv's. They are not interchangeable.", "level": "Start", "effect": "Inspect", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-list-isolated-python-tools", "category": "Python \u0026 local AI", "title": "List isolated Python tools", "command": "uv tool list", "explanation": "Tools installed with uv tool install each get their own environment, so a CLI cannot break your projects.", "level": "Start", "effect": "Inspect", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-use-a-project-s-environment", "category": "Python \u0026 local AI", "title": "Use a project's environment", "command": "uv run python --version", "explanation": "In a uv project, respects the project's environment and Python requirements; may create or sync the environment.", "level": "Start", "effect": "Run", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-create-a-virtual-environment", "category": "Python \u0026 local AI", "title": "Create a virtual environment", "command": "uv venv --python 3.12 .venv", "explanation": "Creates .venv in the current directory. uv downloads that Python version if it is missing.", "level": "Start", "effect": "Write", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-activate-a-virtual-environment", "category": "Python \u0026 local AI", "title": "Activate a virtual environment", "command": "source .venv/bin/activate", "explanation": "Run deactivate to leave. uv run avoids needing this at all, which is usually the better habit.", "level": "Start", "effect": "Run", "source": "https://docs.astral.sh/uv/", "tool": "source"}, {"id": "python-local-ai-sync-a-uv-project", "category": "Python \u0026 local AI", "title": "Sync a uv project", "command": "uv sync --locked", "explanation": "Uses the existing lockfile and fails if it needs updating. Run only in a uv project.", "level": "Intermediate", "effect": "Write", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-run-a-python-script", "category": "Python \u0026 local AI", "title": "Run a Python script", "command": "uv run python script.py", "explanation": "Replace script.py with your actual script. Dependencies belong in the project.", "level": "Start", "effect": "Run", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-inspect-dependency-relationships", "category": "Python \u0026 local AI", "title": "Inspect dependency relationships", "command": "uv tree", "explanation": "Prints the current project's dependency graph.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-add-a-declared-dependency", "category": "Python \u0026 local AI", "title": "Add a declared dependency", "command": "uv add httpx", "explanation": "Changes pyproject.toml, lockfile and environment. Use only when your project needs this dependency.", "level": "Intermediate", "effect": "Write", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-find-the-python-interpreter", "category": "Python \u0026 local AI", "title": "Find the Python interpreter", "command": "python3 -c 'import sys; print(sys.executable); print(sys.version)'", "explanation": "Use uv run python for the project-specific interpreter rather than assuming global python3 is the correct one.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.python.org/3/using/cmdline.html", "tool": "python3"}, {"id": "python-local-ai-find-the-uv-cache", "category": "Python \u0026 local AI", "title": "Find the uv cache", "command": "uv cache dir", "explanation": "Inspect before cleaning. uv cache prune is a separate mutation and cache cleanup means future downloads.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "python-local-ai-list-local-ollama-models", "category": "Python \u0026 local AI", "title": "List local Ollama models", "command": "ollama list", "explanation": "Shows downloaded models and their size on disk. Disk size is a rough floor for memory use, not a promise.", "level": "Start", "effect": "Inspect", "source": "https://ollama.com/", "tool": "ollama"}, {"id": "python-local-ai-see-loaded-ai-models", "category": "Python \u0026 local AI", "title": "See loaded AI models", "command": "ollama ps", "explanation": "Shows models currently in memory. An empty list means the service is idle, not that Ollama is missing.", "level": "Start", "effect": "Inspect", "source": "https://ollama.com/", "tool": "ollama"}, {"id": "python-local-ai-run-a-model", "category": "Python \u0026 local AI", "title": "Run a model", "command": "ollama run llama3.1:8b", "explanation": "Downloads the model on first use, then loads it into memory. Stop containers and other heavy work first on a small machine. /bye exits the chat.", "level": "Intermediate", "effect": "Run", "source": "https://ollama.com/", "tool": "ollama"}, {"id": "python-local-ai-release-a-loaded-model", "category": "Python \u0026 local AI", "title": "Release a loaded model", "command": "ollama stop llama3.1:8b", "explanation": "Unloads the model from memory. It does not delete the downloaded files.", "level": "Start", "effect": "Run", "source": "https://ollama.com/", "tool": "ollama"}, {"id": "python-local-ai-inspect-model-metadata", "category": "Python \u0026 local AI", "title": "Inspect model metadata", "command": "ollama show llama3.1:8b", "explanation": "Read the architecture, parameter count and context length before choosing settings.", "level": "Intermediate", "effect": "Inspect", "source": "https://ollama.com/", "tool": "ollama"}, {"id": "python-local-ai-inspect-llama-cpp-options", "category": "Python \u0026 local AI", "title": "Inspect llama.cpp options", "command": "llama-cli --help", "explanation": "Runs GGUF models directly, without a model manager. Start with conservative context sizes.", "level": "Advanced", "effect": "Inspect", "source": "https://github.com/ggml-org/llama.cpp", "tool": "llama.cpp"}, {"id": "python-local-ai-run-a-local-gguf-model", "category": "Python \u0026 local AI", "title": "Run a local GGUF model", "command": "llama-cli -m /path/to/model.gguf -p 'Explain this project' -n 128 -c 2048", "explanation": "Replace the file path. Context size and GPU offload settings decide how much memory this takes.", "level": "Advanced", "effect": "Run", "source": "https://github.com/ggml-org/llama.cpp", "tool": "llama.cpp"}, {"id": "data-files-media-read-a-json-field", "category": "Data, files \u0026 media", "title": "Read a JSON field", "command": "jq '.scripts' package.json", "explanation": "Print just the scripts object. jq is for structured data; rg is for textual searching.", "level": "Start", "effect": "Inspect", "source": "https://jqlang.github.io/jq/manual/", "tool": "jq"}, {"id": "data-files-media-get-raw-json-text", "category": "Data, files \u0026 media", "title": "Get raw JSON text", "command": "jq -r '.name' package.json", "explanation": "-r outputs the string without JSON quotation marks.", "level": "Start", "effect": "Inspect", "source": "https://jqlang.github.io/jq/manual/", "tool": "jq"}, {"id": "data-files-media-validate-json", "category": "Data, files \u0026 media", "title": "Validate JSON", "command": "jq empty package.json", "explanation": "A successful exit confirms valid JSON; it does not validate an application-specific schema.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.github.io/jq/manual/", "tool": "jq"}, {"id": "data-files-media-browse-large-json-interactively", "category": "Data, files \u0026 media", "title": "Browse large JSON interactively", "command": "jless package.json", "explanation": "Navigate structured data without printing a giant document. q quits.", "level": "Start", "effect": "Inspect", "source": "https://jless.io/", "tool": "jless"}, {"id": "data-files-media-read-compose-service-names-from-yaml", "category": "Data, files \u0026 media", "title": "Read Compose service names from YAML", "command": "yq '.services | keys' docker-compose.yml", "explanation": "Reads the raw YAML without Compose's variable interpolation. This is Mike Farah's Go yq, not the Python one.", "level": "Intermediate", "effect": "Inspect", "source": "https://mikefarah.gitbook.io/yq/", "tool": "yq"}, {"id": "data-files-media-read-markdown-nicely", "category": "Data, files \u0026 media", "title": "Read Markdown nicely", "command": "glow README.md", "explanation": "Renders Markdown in the terminal. Helpful for project instructions.", "level": "Start", "effect": "Inspect", "source": "https://github.com/charmbracelet/glow", "tool": "glow"}, {"id": "data-files-media-preview-a-text-substitution", "category": "Data, files \u0026 media", "title": "Preview a text substitution", "command": "printf '%s\\n' 'old-name' | sd 'old-name' 'new-name'", "explanation": "Transform piped text first to see the result. Passing a filename to sd instead edits that file in place, with no undo.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "printf"}, {"id": "data-files-media-edit-a-known-string-in-one-file", "category": "Data, files \u0026 media", "title": "Edit a known string in one file", "command": "sd 'old-name' 'new-name' path/to/file", "explanation": "Replace placeholders; edits in place. Review git diff afterwards and use a narrow path.", "level": "Intermediate", "effect": "Write", "source": "https://github.com/chmln/sd", "tool": "sd"}, {"id": "data-files-media-watch-files-and-rerun-tests", "category": "Data, files \u0026 media", "title": "Watch files and rerun tests", "command": "watchexec -e py -- uv run pytest", "explanation": "Runs tests after Python files change. Requires pytest in that project. Ctrl+C stops the watcher.", "level": "Intermediate", "effect": "Run", "source": "https://github.com/watchexec/watchexec", "tool": "watchexec"}, {"id": "data-files-media-benchmark-two-read-only-commands", "category": "Data, files \u0026 media", "title": "Benchmark two read-only commands", "command": "hyperfine --warmup 2 'rg TODO . -g *.ts' 'rg -F TODO . -g *.ts'", "explanation": "Example comparison of regex vs literal search. Run in a suitable repo; benchmark commands execute repeatedly.", "level": "Advanced", "effect": "Run", "source": "https://github.com/sharkdp/hyperfine", "tool": "hyperfine"}, {"id": "data-files-media-move-a-file-to-trash", "category": "Data, files \u0026 media", "title": "Move a file to Trash", "command": "trash ./unwanted-file.txt", "explanation": "Sends the file to the desktop Trash instead of unlinking it, so you can get it back. On Linux the trash-cli command is usually trash-put.", "level": "Start", "effect": "Write", "source": "https://github.com/sindresorhus/trash-cli", "tool": "trash"}, {"id": "data-files-media-inspect-an-archive-before-extraction", "category": "Data, files \u0026 media", "title": "Inspect an archive before extraction", "command": "bsdtar -tf archive.7z", "explanation": "libarchive's bsdtar reads zip, 7z, rar and more. Always read the filenames before extracting.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "bsdtar"}, {"id": "data-files-media-extract-into-a-fresh-folder", "category": "Data, files \u0026 media", "title": "Extract into a fresh folder", "command": "mkdir -p extracted\nbsdtar -xf archive.7z -C extracted", "explanation": "Extracting into an empty directory stops a badly built archive from scattering files over your working directory.", "level": "Intermediate", "effect": "Write", "source": "https://jqlang.org/manual/", "tool": "bsdtar"}, {"id": "data-files-media-inspect-image-dimensions", "category": "Data, files \u0026 media", "title": "Inspect image dimensions", "command": "magick identify image.png", "explanation": "Reports format, dimensions and colour depth without modifying the file.", "level": "Start", "effect": "Inspect", "source": "https://imagemagick.org/script/command-line-processing.php", "tool": "imagemagick"}, {"id": "data-files-media-make-a-web-sized-image", "category": "Data, files \u0026 media", "title": "Make a web-sized image", "command": "magick input.jpg -auto-orient -resize '1600x1600\u003e' -strip output.webp", "explanation": "Creates a new WebP and removes metadata. The \u003e prevents upscaling. Keep the original file.", "level": "Intermediate", "effect": "Write", "source": "https://imagemagick.org/script/command-line-processing.php", "tool": "imagemagick"}, {"id": "data-files-media-extract-text-from-an-image", "category": "Data, files \u0026 media", "title": "Extract text from an image", "command": "tesseract screenshot.png stdout", "explanation": "Runs OCR locally, with no upload. Non-English text needs that language's data package installed.", "level": "Intermediate", "effect": "Run", "source": "https://tesseract-ocr.github.io/", "tool": "tesseract"}, {"id": "data-files-media-list-ocr-languages", "category": "Data, files \u0026 media", "title": "List OCR languages", "command": "tesseract --list-langs", "explanation": "Check what is installed before assuming a language works. Each one is a separate package.", "level": "Start", "effect": "Inspect", "source": "https://tesseract-ocr.github.io/", "tool": "tesseract"}, {"id": "data-files-media-reach-a-command-an-alias-is-shadowing", "category": "Data, files \u0026 media", "title": "Reach a command an alias is shadowing", "command": "command gs --version", "explanation": "If gs is an alias for git status, command skips the alias and runs the real executable. whence -va gs shows both.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.ghostscript.com/documentation/", "tool": "ghostscript"}, {"id": "data-files-media-hash-a-downloaded-file", "category": "Data, files \u0026 media", "title": "Hash a downloaded file", "command": "shasum -a 256 download.tar.gz", "explanation": "Compare with the publisher's checksum through a trusted channel. The hash alone does not prove provenance.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "shasum"}, {"id": "data-files-media-inspect-a-sqlite-database-read-only", "category": "Data, files \u0026 media", "title": "Inspect a SQLite database read-only", "command": "sqlite3 -readonly database.sqlite '.tables'", "explanation": "Replace the file path. Read-only mode prevents accidental database writes.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "sqlite3"}, {"id": "data-files-media-show-sqlite-schema", "category": "Data, files \u0026 media", "title": "Show SQLite schema", "command": "sqlite3 -readonly database.sqlite '.schema'", "explanation": "Read structure before querying. Do not point this at an unknown production database file.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "sqlite3"}, {"id": "data-files-media-check-native-build-tools", "category": "Data, files \u0026 media", "title": "Check native build tools", "command": "cmake --version", "explanation": "Many tools compile from source when there is no binary for your platform. Keep build output in a per-project directory.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "cmake"}, {"id": "data-files-media-find-a-native-library-s-flags", "category": "Data, files \u0026 media", "title": "Find a native library's flags", "command": "pkg-config --cflags --libs libpng", "explanation": "Returns the compiler and linker flags for an installed library. pkgconf provides the pkg-config command on most systems.", "level": "Advanced", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "pkg-config"}, {"id": "data-files-media-check-a-go-project", "category": "Data, files \u0026 media", "title": "Check a Go project", "command": "go test ./...", "explanation": "Run in a Go module. Tests may execute arbitrary project code and access configured resources.", "level": "Intermediate", "effect": "Run", "source": "https://go.dev/doc/", "tool": "go"}, {"id": "data-files-media-inspect-go-environment-paths", "category": "Data, files \u0026 media", "title": "Inspect Go environment paths", "command": "go env GOPATH GOMOD GOROOT", "explanation": "Select only needed fields instead of dumping all environment variables.", "level": "Intermediate", "effect": "Inspect", "source": "https://go.dev/doc/", "tool": "go"}, {"id": "data-files-media-check-a-language-server", "category": "Data, files \u0026 media", "title": "Check a language server", "command": "gopls version", "explanation": "Language servers power editor completion and diagnostics. They normally run through the editor, not by hand.", "level": "Intermediate", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "gopls"}, {"id": "data-files-media-inspect-a-tree-sitter-grammar", "category": "Data, files \u0026 media", "title": "Inspect a tree-sitter grammar", "command": "tree-sitter --help", "explanation": "Parser tooling behind modern syntax highlighting. The library and the CLI are separate packages.", "level": "Advanced", "effect": "Inspect", "source": "https://jqlang.org/manual/", "tool": "tree-sitter"}, {"id": "networking-processes-check-http-headers", "category": "Networking \u0026 processes", "title": "Check HTTP headers", "command": "curl -I https://example.com", "explanation": "Sends a HEAD request. Useful for redirects, caching and content type without downloading the page body.", "level": "Start", "effect": "Network", "source": "https://curl.se/docs/manpage.html", "tool": "curl"}, {"id": "networking-processes-inspect-a-local-web-app", "category": "Networking \u0026 processes", "title": "Inspect a local web app", "command": "curl -sS -o /dev/null -w '%{http_code}\\n' http://localhost:3000", "explanation": "Prints the HTTP status code. It fails if no service is listening.", "level": "Intermediate", "effect": "Network", "source": "https://curl.se/docs/manpage.html", "tool": "curl"}, {"id": "networking-processes-read-a-local-json-api", "category": "Networking \u0026 processes", "title": "Read a local JSON API", "command": "xh GET http://localhost:3000/api/health", "explanation": "Friendly HTTP client. Replace with an endpoint your application actually implements.", "level": "Start", "effect": "Network", "source": "https://github.com/ducaale/xh", "tool": "xh"}, {"id": "networking-processes-download-to-an-explicit-file", "category": "Networking \u0026 processes", "title": "Download to an explicit file", "command": "curl --fail --location --output download.zip https://example.com/download.zip", "explanation": "Example URL must be replaced. --fail makes HTTP errors fail the command; --location follows redirects.", "level": "Intermediate", "effect": "Write", "source": "https://curl.se/docs/manpage.html", "tool": "curl"}, {"id": "networking-processes-continue-an-interrupted-download", "category": "Networking \u0026 processes", "title": "Continue an interrupted download", "command": "wget -c https://example.com/large-file.zip", "explanation": "Replace the URL. Resumes if the server supports it and writes into the current directory.", "level": "Intermediate", "effect": "Write", "source": "https://www.gnu.org/software/wget/manual/", "tool": "wget"}, {"id": "networking-processes-find-a-port-listener", "category": "Networking \u0026 processes", "title": "Find a port listener", "command": "lsof -nP -iTCP:3000 -sTCP:LISTEN", "explanation": "Identify the process holding a port before stopping anything. On Linux, ss -tlnp answers the same question.", "level": "Start", "effect": "Inspect", "source": "https://github.com/lsof-org/lsof", "tool": "lsof"}, {"id": "networking-processes-see-all-listening-tcp-ports", "category": "Networking \u0026 processes", "title": "See all listening TCP ports", "command": "lsof -nP -iTCP -sTCP:LISTEN", "explanation": "-nP skips DNS and service-name lookups, so the output is fast and literal.", "level": "Start", "effect": "Inspect", "source": "https://github.com/lsof-org/lsof", "tool": "lsof"}, {"id": "networking-processes-stop-a-stuck-local-dev-server", "category": "Networking \u0026 processes", "title": "Stop a stuck local dev server", "command": "kill $(lsof -nP -iTCP:3000 -sTCP:LISTEN -t)", "explanation": "Sends SIGTERM to every listener on that port. Try Ctrl+C in the owning terminal first; this discards unsaved work in that process.", "level": "Intermediate", "effect": "Disruptive", "source": "https://curl.se/docs/manpage.html", "tool": "kill"}, {"id": "networking-processes-look-up-dns", "category": "Networking \u0026 processes", "title": "Look up DNS", "command": "dig example.com", "explanation": "Shows DNS answers, not an HTTP response. Useful when the browser cannot find a host.", "level": "Intermediate", "effect": "Network", "source": "https://curl.se/docs/manpage.html", "tool": "dig"}, {"id": "networking-processes-inspect-a-tls-handshake", "category": "Networking \u0026 processes", "title": "Inspect a TLS handshake", "command": "openssl s_client -connect example.com:443 -servername example.com \u003c/dev/null", "explanation": "Uses SNI for the correct certificate. Check verification output; the handshake alone is not an application health check.", "level": "Advanced", "effect": "Network", "source": "https://curl.se/docs/manpage.html", "tool": "openssl"}, {"id": "networking-processes-open-the-current-directory", "category": "Networking \u0026 processes", "title": "Open the current directory", "command": "open .", "explanation": "Opens the directory in Finder on macOS. The Linux equivalent is xdg-open .", "level": "Start", "effect": "Run", "source": "https://support.apple.com/guide/terminal/open-or-quit-terminal-trml35697/mac", "tool": "open"}, {"id": "networking-processes-copy-a-file-to-the-clipboard", "category": "Networking \u0026 processes", "title": "Copy a file to the clipboard", "command": "pbcopy \u003c README.md", "explanation": "macOS clipboard. Replaces its contents. On Linux use xclip -selection clipboard or wl-copy. Never pipe secrets into a synced clipboard.", "level": "Start", "effect": "Write", "source": "https://curl.se/docs/manpage.html", "tool": "pbcopy"}, {"id": "networking-processes-read-clipboard-text", "category": "Networking \u0026 processes", "title": "Read clipboard text", "command": "pbpaste", "explanation": "Prints the macOS text clipboard. On Linux use xclip -o -selection clipboard or wl-paste.", "level": "Start", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "pbpaste"}, {"id": "networking-processes-keep-a-long-job-awake", "category": "Networking \u0026 processes", "title": "Keep a long job awake", "command": "caffeinate -i pnpm build", "explanation": "Prevents idle sleep only while the command runs. Does not permanently change power settings.", "level": "Intermediate", "effect": "Run", "source": "https://curl.se/docs/manpage.html", "tool": "caffeinate"}, {"id": "networking-processes-check-battery-and-power-source", "category": "Networking \u0026 processes", "title": "Check battery and power source", "command": "pmset -g batt", "explanation": "Read-only power status.", "level": "Start", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "pmset"}, {"id": "networking-processes-check-memory-pressure", "category": "Networking \u0026 processes", "title": "Check memory pressure", "command": "memory_pressure", "explanation": "macOS memory statistics. Never use its pressure-generation options for a routine check. On Linux, read free -h and /proc/pressure/memory.", "level": "Intermediate", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "memory_pressure"}, {"id": "networking-processes-check-swap-use", "category": "Networking \u0026 processes", "title": "Check swap use", "command": "sysctl vm.swapusage", "explanation": "Snapshot of swap usage; sustained pressure matters more than a single number.", "level": "Intermediate", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "sysctl"}, {"id": "networking-processes-inspect-cpu-and-memory-interactively", "category": "Networking \u0026 processes", "title": "Inspect CPU and memory interactively", "command": "btop", "explanation": "Full-screen resource dashboard. q exits. htop is the lighter classic alternative.", "level": "Start", "effect": "Inspect", "source": "https://github.com/aristocratos/btop", "tool": "btop"}, {"id": "networking-processes-use-the-macos-process-monitor", "category": "Networking \u0026 processes", "title": "Use the macOS process monitor", "command": "top -l 1 -o cpu -n 10", "explanation": "One snapshot sorted by CPU. macOS top flags differ from Linux top.", "level": "Intermediate", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "top"}, {"id": "networking-processes-inspect-processes-with-procs", "category": "Networking \u0026 processes", "title": "Inspect processes with procs", "command": "procs", "explanation": "A more readable ps. macOS permissions limit what any tool can see about other users' processes.", "level": "Start", "effect": "Inspect", "source": "https://github.com/dalance/procs", "tool": "procs"}, {"id": "networking-processes-alternative-process-dashboard", "category": "Networking \u0026 processes", "title": "Alternative process dashboard", "command": "htop", "explanation": "The classic interactive process viewer. F10 or q exits.", "level": "Start", "effect": "Inspect", "source": "https://htop.dev/", "tool": "htop"}, {"id": "networking-processes-check-disk-capacity", "category": "Networking \u0026 processes", "title": "Check disk capacity", "command": "duf", "explanation": "Shows mounted filesystem space in a table. df -h is the built-in alternative.", "level": "Start", "effect": "Inspect", "source": "https://github.com/muesli/duf", "tool": "duf"}, {"id": "networking-processes-find-a-directory-s-large-children", "category": "Networking \u0026 processes", "title": "Find a directory's large children", "command": "dust -d 2 ~/projects", "explanation": "Read-only size scan, two levels deep. Point it at a directory rather than scanning the whole disk.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/bootandy/dust", "tool": "dust"}, {"id": "networking-processes-see-macos-version", "category": "Networking \u0026 processes", "title": "See macOS version", "command": "sw_vers", "explanation": "Reports installed macOS version and build.", "level": "Start", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "sw_vers"}, {"id": "networking-processes-inspect-hardware", "category": "Networking \u0026 processes", "title": "Inspect hardware", "command": "system_profiler SPHardwareDataType", "explanation": "macOS hardware summary. It includes serial identifiers: redact them before sharing the output. On Linux use lscpu and free -h.", "level": "Start", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "system_profiler"}, {"id": "networking-processes-check-developer-tools", "category": "Networking \u0026 processes", "title": "Check developer tools", "command": "xcode-select -p", "explanation": "Prints the active macOS developer-tools directory. Many Homebrew builds need Apple's Command Line Tools.", "level": "Start", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "xcode-select"}, {"id": "networking-processes-review-an-ssh-host-config", "category": "Networking \u0026 processes", "title": "Review an SSH host config", "command": "ssh -G example-host", "explanation": "Prints effective SSH configuration for a host alias without connecting. Replace the alias; output may include private network paths.", "level": "Advanced", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "ssh"}, {"id": "networking-processes-preview-a-directory-sync", "category": "Networking \u0026 processes", "title": "Preview a directory sync", "command": "rsync -avhn source/ destination/", "explanation": "-n is a dry run. A trailing slash on the source copies its contents rather than the directory itself. Read the plan before removing -n.", "level": "Advanced", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "rsync"}, {"id": "networking-processes-list-gpg-public-keys", "category": "Networking \u0026 processes", "title": "List GPG public keys", "command": "gpg --list-keys", "explanation": "Read-only inventory of public keys. Never export secret keys just to debug signing.", "level": "Intermediate", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "gpg"}, {"id": "networking-processes-inspect-a-file-type", "category": "Networking \u0026 processes", "title": "Inspect a file type", "command": "file path/to/file", "explanation": "Useful before deciding whether a file is text, binary, an archive or an executable.", "level": "Start", "effect": "Inspect", "source": "https://curl.se/docs/manpage.html", "tool": "file"}, {"id": "editors-sessions-open-a-project-in-vs-code", "category": "Editors \u0026 sessions", "title": "Open a project in VS Code", "command": "code .", "explanation": "Opens the current directory, if the code command is on your PATH. Set EDITOR=\"code --wait\" so Git waits for the window to close.", "level": "Start", "effect": "Run", "source": "https://github.com/tmux/tmux/wiki", "tool": "code"}, {"id": "editors-sessions-open-a-terminal-editor", "category": "Editors \u0026 sessions", "title": "Open a terminal editor", "command": "nvim README.md", "explanation": "Neovim with no configuration is already usable. Distributions such as LazyVim add language support on top.", "level": "Start", "effect": "Run", "source": "https://neovim.io/doc/", "tool": "neovim"}, {"id": "editors-sessions-learn-vim-interactively", "category": "Editors \u0026 sessions", "title": "Learn Vim interactively", "command": "nvim +Tutor", "explanation": "Opens Neovim's tutorial. Esc returns to normal mode; :q exits, :w saves.", "level": "Start", "effect": "Run", "source": "https://neovim.io/doc/", "tool": "neovim"}, {"id": "editors-sessions-start-a-named-session", "category": "Editors \u0026 sessions", "title": "Start a named session", "command": "tmux new -s dev", "explanation": "Creates a terminal session that survives terminal disconnection. Default prefix is Ctrl+B.", "level": "Start", "effect": "Run", "source": "https://github.com/tmux/tmux/wiki", "tool": "tmux"}, {"id": "editors-sessions-list-sessions", "category": "Editors \u0026 sessions", "title": "List sessions", "command": "tmux ls", "explanation": "Shows saved sessions; no server running is normal if you have never started tmux.", "level": "Start", "effect": "Inspect", "source": "https://github.com/tmux/tmux/wiki", "tool": "tmux"}, {"id": "editors-sessions-reattach-a-session", "category": "Editors \u0026 sessions", "title": "Reattach a session", "command": "tmux attach -t dev", "explanation": "Return to the named dev session. Ctrl+B then D detaches without stopping processes.", "level": "Start", "effect": "Run", "source": "https://github.com/tmux/tmux/wiki", "tool": "tmux"}, {"id": "editors-sessions-inspect-tmux-bindings", "category": "Editors \u0026 sessions", "title": "Inspect tmux bindings", "command": "tmux list-keys", "explanation": "Available once a server exists. Default prefix shortcuts: % split vertically, double quote split horizontally, c new window.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/tmux/tmux/wiki", "tool": "tmux"}, {"id": "editors-sessions-validate-a-terminal-config", "category": "Editors \u0026 sessions", "title": "Validate a terminal config", "command": "ghostty +validate-config", "explanation": "Checks the config file for errors before you reload. On macOS the binary lives inside the app bundle: /Applications/Ghostty.app/Contents/MacOS/ghostty.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/tmux/tmux/wiki", "tool": "ghostty"}, {"id": "editors-sessions-read-every-terminal-option", "category": "Editors \u0026 sessions", "title": "Read every terminal option", "command": "ghostty +show-config --default --docs", "explanation": "Prints the documented defaults for the installed build. Pipe it into less; it is long.", "level": "Intermediate", "effect": "Inspect", "source": "https://github.com/tmux/tmux/wiki", "tool": "ghostty"}, {"id": "editors-sessions-check-direnv-state", "category": "Editors \u0026 sessions", "title": "Check direnv state", "command": "direnv status", "explanation": "Shows whether this directory's environment is loaded and permitted. direnv needs a hook in your .zshrc to do anything.", "level": "Intermediate", "effect": "Inspect", "source": "https://direnv.net/", "tool": "direnv"}, {"id": "editors-sessions-allow-a-reviewed-environment", "category": "Editors \u0026 sessions", "title": "Allow a reviewed environment", "command": "direnv allow .", "explanation": "Executes the directory's .envrc as shell code. Read it first, especially in a newly cloned repository.", "level": "Intermediate", "effect": "Run", "source": "https://direnv.net/", "tool": "direnv"}, {"id": "packages-maintenance-get-short-practical-help", "category": "Packages \u0026 maintenance", "title": "Get short practical help", "command": "tldr tar", "explanation": "tealdeer provides the tldr executable. If its cache is missing, tldr --update downloads examples.", "level": "Start", "effect": "Inspect", "source": "https://github.com/tealdeer-rs/tealdeer", "tool": "tealdeer"}, {"id": "packages-maintenance-read-full-help", "category": "Packages \u0026 maintenance", "title": "Read full help", "command": "rg --help", "explanation": "Almost every tool answers --help. Use man for system commands, and SUBCOMMAND --help for nested CLIs such as git or docker.", "level": "Start", "effect": "Inspect", "source": "https://github.com/BurntSushi/ripgrep", "tool": "ripgrep"}, {"id": "packages-maintenance-inspect-a-package", "category": "Packages \u0026 maintenance", "title": "Inspect a package", "command": "brew info ripgrep", "explanation": "Shows version, description, dependencies and installation details. Package name ripgrep provides executable rg.", "level": "Start", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-list-installed-command-packages", "category": "Packages \u0026 maintenance", "title": "List installed command packages", "command": "brew list --formula", "explanation": "Includes libraries and transitive dependencies, not just user-facing CLIs.", "level": "Start", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-list-installed-desktop-packages", "category": "Packages \u0026 maintenance", "title": "List installed desktop packages", "command": "brew list --cask", "explanation": "macOS GUI apps and fonts installed through Homebrew. Fonts provide no commands of their own.", "level": "Start", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-understand-why-a-library-exists", "category": "Packages \u0026 maintenance", "title": "Understand why a library exists", "command": "brew uses --installed libpng", "explanation": "Shows installed packages that depend on libpng. Avoid manually deleting dependency directories.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-list-leaf-packages", "category": "Packages \u0026 maintenance", "title": "List leaf packages", "command": "brew leaves", "explanation": "Packages not required by other installed formulae. A leaf is not necessarily unused.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-check-missing-dependencies", "category": "Packages \u0026 maintenance", "title": "Check missing dependencies", "command": "brew missing", "explanation": "No output is the good result: every installed formula has what it declares.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-run-homebrew-diagnostics", "category": "Packages \u0026 maintenance", "title": "Run Homebrew diagnostics", "command": "brew doctor", "explanation": "Reports common installation problems. Read each warning before acting; never answer a permissions warning with a recursive sudo chown.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-refresh-package-metadata", "category": "Packages \u0026 maintenance", "title": "Refresh package metadata", "command": "brew update", "explanation": "Downloads current metadata; does not upgrade all installed formulae.", "level": "Intermediate", "effect": "Network", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-review-available-updates", "category": "Packages \u0026 maintenance", "title": "Review available updates", "command": "brew outdated", "explanation": "Run after brew update. Read the list before upgrading; a major version bump can change a tool's flags.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-upgrade-one-selected-tool", "category": "Packages \u0026 maintenance", "title": "Upgrade one selected tool", "command": "brew upgrade ripgrep", "explanation": "Updates only the selected formula and any needed dependencies. Verify your workflow after upgrading.", "level": "Intermediate", "effect": "Write", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-preview-cache-cleanup", "category": "Packages \u0026 maintenance", "title": "Preview cache cleanup", "command": "brew cleanup --dry-run", "explanation": "Lists what would be removed without deleting anything. Drop --dry-run only after reading the list.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-preview-unused-dependency-removal", "category": "Packages \u0026 maintenance", "title": "Preview unused dependency removal", "command": "brew autoremove --dry-run", "explanation": "Read the proposed list before considering a real removal.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-locate-a-package-s-files", "category": "Packages \u0026 maintenance", "title": "Locate a package's files", "command": "brew list libarchive", "explanation": "Lists files installed by a package, including executables that may not be linked into PATH.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-export-a-reproducible-package-list", "category": "Packages \u0026 maintenance", "title": "Export a reproducible package list", "command": "brew bundle dump --file=./Brewfile", "explanation": "Writes a Brewfile listing what you installed. It refuses to overwrite an existing file unless forced. This is how you rebuild a machine.", "level": "Advanced", "effect": "Write", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-check-a-brewfile", "category": "Packages \u0026 maintenance", "title": "Check a Brewfile", "command": "brew bundle check --file=./Brewfile", "explanation": "Compares a manifest with installed dependencies. It does not install missing packages.", "level": "Intermediate", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-inspect-a-cask", "category": "Packages \u0026 maintenance", "title": "Inspect a cask", "command": "brew info --cask ghostty", "explanation": "Shows a GUI app's version, install path and upstream site. Casks are macOS-only.", "level": "Start", "effect": "Inspect", "source": "https://docs.brew.sh/Manpage", "tool": "brew"}, {"id": "packages-maintenance-update-an-isolated-python-tool", "category": "Packages \u0026 maintenance", "title": "Update an isolated Python tool", "command": "uv tool upgrade ruff", "explanation": "Upgrades that tool's own environment and nothing else. Replace ruff with a tool from uv tool list.", "level": "Advanced", "effect": "Write", "source": "https://docs.astral.sh/uv/reference/cli/", "tool": "uv"}, {"id": "packages-maintenance-see-local-pnpm-storage", "category": "Packages \u0026 maintenance", "title": "See local pnpm storage", "command": "pnpm store path", "explanation": "Prints the shared content-addressed store location. Do not delete it while installs run.", "level": "Intermediate", "effect": "Inspect", "source": "https://pnpm.io/cli/run", "tool": "pnpm"}, {"id": "packages-maintenance-check-git-settings-with-origins", "category": "Packages \u0026 maintenance", "title": "Check Git settings with origins", "command": "git config --show-origin --get-regexp '^(core.pager|fetch.prune|pull.rebase|delta\\.)'", "explanation": "Shows which file each setting came from. A narrow pattern avoids dumping credentials and private remote URLs.", "level": "Advanced", "effect": "Inspect", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "shell-foundations-read-a-file-without-decorations", "category": "Shell foundations", "title": "Read a file without decorations", "command": "command cat README.md", "explanation": "Plain text is best for pipelines and scripts; bat is useful for interactive reading.", "level": "Start", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "cat"}, {"id": "shell-foundations-read-the-beginning-of-a-log", "category": "Shell foundations", "title": "Read the beginning of a log", "command": "head -n 40 app.log", "explanation": "Replace the example filename. Avoid printing entire large logs or files containing secrets.", "level": "Start", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "head"}, {"id": "shell-foundations-follow-a-rotating-log", "category": "Shell foundations", "title": "Follow a rotating log", "command": "tail -F app.log", "explanation": "Follows the filename across replacement or rotation. Ctrl+C stops watching.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "tail"}, {"id": "shell-foundations-extract-a-range-of-lines", "category": "Shell foundations", "title": "Extract a range of lines", "command": "sed -n '20,40p' README.md", "explanation": "Prints a line range without editing the file. macOS ships BSD sed, Linux ships GNU sed, and their in-place editing flags differ.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "sed"}, {"id": "shell-foundations-count-lines-words-and-bytes", "category": "Shell foundations", "title": "Count lines, words and bytes", "command": "wc README.md", "explanation": "Reports basic text counts. wc -l selects lines; wc -c selects bytes.", "level": "Start", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "wc"}, {"id": "shell-foundations-sort-and-deduplicate-text", "category": "Shell foundations", "title": "Sort and deduplicate text", "command": "printf '%s\\n' beta alpha beta | sort | uniq -c", "explanation": "Produces a sorted frequency table. uniq only combines adjacent duplicate lines, so sorting matters.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "printf"}, {"id": "shell-foundations-select-a-delimited-column", "category": "Shell foundations", "title": "Select a delimited column", "command": "cut -d, -f1 simple.csv", "explanation": "Works for simple delimiter-separated text. Quoted CSV fields need a proper CSV parser, not cut.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "cut"}, {"id": "shell-foundations-compute-with-awk", "category": "Shell foundations", "title": "Compute with awk", "command": "printf 'alpha 2\\nbeta 3\\n' | awk '{sum += $2} END {print sum}'", "explanation": "Accumulates the second whitespace-separated field. Start with small sample input to understand the transformation.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "printf"}, {"id": "shell-foundations-pass-filenames-without-splitting-spaces", "category": "Shell foundations", "title": "Pass filenames without splitting spaces", "command": "fd -0 -e md --type f | xargs -0 -I{} printf 'Found: %s\\n' '{}'", "explanation": "NUL-delimited records preserve spaces and most unusual filenames. This example only prints a preview.", "level": "Advanced", "effect": "Inspect", "source": "https://github.com/sharkdp/fd", "tool": "fd"}, {"id": "shell-foundations-compare-two-files", "category": "Shell foundations", "title": "Compare two files", "command": "diff -u old.txt new.txt", "explanation": "Unified diff. Exit 1 means files differ; it is not necessarily a tool failure.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "diff"}, {"id": "shell-foundations-read-long-output-in-a-pager", "category": "Shell foundations", "title": "Read long output in a pager", "command": "git log --oneline | less", "explanation": "Space scrolls a page, / searches, n advances and q quits.", "level": "Start", "effect": "Inspect", "source": "https://git-scm.com/docs", "tool": "git"}, {"id": "shell-foundations-inspect-file-permissions", "category": "Shell foundations", "title": "Inspect file permissions", "command": "stat -f '%Sp %Su %Sg %N' README.md", "explanation": "Shows mode, owner, group and name. This is BSD syntax for macOS; GNU stat on Linux uses stat -c '%A %U %G %n'.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "stat"}, {"id": "shell-foundations-understand-an-executable-permission", "category": "Shell foundations", "title": "Understand an executable permission", "command": "ls -l script.zsh", "explanation": "Inspect before changing modes. chmod u+x script.zsh adds execute permission for the owner only.", "level": "Intermediate", "effect": "Inspect", "source": "https://www.gnu.org/software/coreutils/manual/", "tool": "ls"}, {"id": "macos-specifics-search-with-spotlight", "category": "macOS specifics", "title": "Search with Spotlight", "command": "mdfind -onlyin ~/projects 'kMDItemFSName == \"README.md\"'", "explanation": "Uses the Spotlight index, so an empty result is not proof a file is absent. fd reads the di
